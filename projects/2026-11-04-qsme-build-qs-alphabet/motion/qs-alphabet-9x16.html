<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<title>The QS Alphabet (QSME Global, 9:16 Shorts cut, 30 s)</title>
<!-- Motion-kit page. Render from the studio root:
     node tools/motion/make.mjs projects/2026-11-04-qsme-build-qs-alphabet/motion/qs-alphabet-9x16.html \
          projects/2026-11-04-qsme-build-qs-alphabet/outputs/qs-alphabet-9x16.mp4 --safe 65,300,1015,1250
     and QA again with --safe 150,300,930,1250 (YouTube Shorts buttons). All text sits in x 150–930, y 300–1250.
     Hook A (default): "What's the QS in QSME?". Hook B (test, not rendered): see post.md. -->
<link rel="stylesheet" href="../../../tools/motion/kit.css">
<link rel="stylesheet" href="qsa.css">
<style>
  .cap { left: 150px; right: 150px; bottom: 690px; }
  .cap span { font-size: 44px; padding: 9px 22px 11px; }
  .head { position: absolute; left: 150px; right: 150px; text-align: center; font: 700 82px/1.04 var(--display); letter-spacing: -0.035em; }
  .acro { position: absolute; left: 150px; font: 700 124px/1 var(--display); letter-spacing: -0.04em; white-space: nowrap; }
  .acro .L { display: inline-block; color: var(--accent); transform-origin: 50% 60%; }
  .good { position: absolute; left: 150px; right: 150px; text-align: center; font: 700 104px/1 var(--display); letter-spacing: -0.045em; }
  .caret2 { position: absolute; height: 10px; border-radius: 5px; background: var(--accent); }
</style>
</head>
<body class="build r9x16">
<div id="root">
  <div id="brollLayer" class="fill"></div>
  <div class="fill bgGrid"></div>
  <div class="fill bgGlow"></div>
  <div class="fill vign"></div>

  <!-- 0 – 4.2: What's the QS in QSME? -->
  <div id="sName" class="fill">
    <div id="head" class="head" style="top:340px">What’s the <span class="g">QS</span><br>in QSME?</div>
    <div id="wmW" class="fill" style="filter:brightness(0) invert(0.94)"></div>
    <div id="wmG" class="fill"></div>
    <div id="car" class="caret2" style="top:928px;width:0"></div>
    <div id="acQ" class="acro" style="top:960px"><span class="L" id="bigQ">Q</span><span id="rQ">uantity</span></div>
    <div id="acS" class="acro" style="top:1092px"><span class="L" id="bigS">S</span><span id="rS">urveying</span></div>
  </div>

  <!-- 4.2 – 6.8: Good QS. Good project. -->
  <div id="sGood" class="fill">
    <div id="good1" class="good" style="top:520px">Good <span class="g">QS.</span></div>
    <div id="good2" class="good" style="top:660px">Good project.</div>
    <div id="goodAside" class="aside" style="left:330px;top:840px;font-size:60px;transform-origin:0 50%">(We’re biased.)</div>
  </div>

  <!-- 6.8 – 10.0: A to Z, never in that order -->
  <div id="sAZ" class="fill"><div id="stripA" class="abs" style="left:152px;top:560px"></div>
    <div id="big7" class="disp abs" style="left:158px;top:400px;font-size:130px;color:var(--accent);white-space:nowrap;transform-origin:30px 100%">7<span style="font-size:66px;vertical-align:top;line-height:1.35">th</span></div>
  </div>

  <div id="letters" class="fill"></div>

  <div id="sZ" class="fill">
    <div id="gz" class="giant" style="left:150px;right:150px;text-align:center;top:420px;font-size:280px">Z</div>
    <div id="wmHost2" class="fill"></div>
    <div id="built" class="abs" style="left:150px;right:150px;top:930px;text-align:center;font:500 40px/1.25 var(--body);color:var(--ink-70)">Built by a <span style="color:var(--ink);font-weight:700">quantity surveyor.</span></div>
  </div>

  <div id="sEnd" class="fill">
    <div id="wmHost3" class="fill"></div>
    <div id="endPill" class="abs" style="left:150px;right:150px;top:700px;display:flex;justify-content:center"><span class="endpill" style="font-size:40px;padding:18px 34px">Book a 30-minute demo</span></div>
    <div id="endUrl" class="abs disp g" style="left:150px;right:150px;top:830px;text-align:center;font-size:104px">qsme.build</div>
    <div id="endSub" class="abs" style="left:150px;right:150px;top:990px;text-align:center;font:500 42px/1 var(--body);color:var(--ink-70)">Bring your spreadsheet.</div>
  </div>

  <div id="tagFoot" class="ftag" style="left:150px;top:306px">Illustrative footage</div>
  <div id="caps" class="fill"></div>
</div>
<script src="../../../tools/motion/kit.js"></script>
<script src="qsa.js"></script>
<script src="qsa-cut.js"></script>
<script>
(function () {
  var mk = QSA.mk; function $(id) { return document.getElementById(id); }
  var DUR = 30.0;
  // o.hardIn / o.hardOut: a hard caption swap (no fade), used where a caption is split so it never reads ahead of its punchline
  function cap(t0, t1, html, o) {
    o = o || {}; var c = mk($('caps'), '<div class="cap"><span>' + html + '</span></div>');
    var k = t0 <= 0 ? [[0, 1]] : o.hardIn ? [[0, 0], [t0, 1, 'hold']] : [[t0, 0], [t0 + 0.1, 1]];
    if (o.hardOut) k.push([t1, 0, 'hold']); else k.push([t1 - 0.1, 1], [t1, 0]);
    Kit.add(c, 'opacity', k); if (t0 > 0 && !o.hardIn) Kit.add(c, 'y', [[t0, 12], [t0 + 0.18, 0, 'out']]); return c;
  }
  cap(6.85, 9.95, 'A to Z. Never in that order.');
  cap(22.65, 25.5, '<b>Z.</b> One record. Built by a <b>QS</b>.');

  /* ---------- 0 – 4.2: the name ---------- */
  Kit.scene('#sName', 0, 4.25);
  var WW = QSA.wordmark($('wmW'), { x: 160, y: 520, w: 760 });
  var WG = QSA.wordmark($('wmG'), { x: 160, y: 520, w: 760 });
  Kit.add(WG.el, 'opacity', [[0, 0], [2.2, 0, 'hold'], [2.32, 1]]);
  ['Q', 'S'].forEach(function (k) { Kit.add(WG[k], 'opacity', [[0, 1]]); Kit.add(WW[k], 'opacity', [[2.2, 1], [2.32, 0]]); });
  ['M', 'E'].forEach(function (k) { WG[k].style.display = 'none'; Kit.add(WW[k], 'opacity', [[2.25, 1], [2.6, 0.28]]); });
  WG.Uw.style.display = 'none'; Kit.add(WW.Uw, 'opacity', [[2.25, 1], [2.6, 0.28]]);
  // a caret blinking under each letter in turn: Q, S, M, E
  var B = QSA.WMBOX, sc = 760 / 1400, car = $('car');
  Kit.each(function (t) {
    var k = Math.min(3, Math.floor(t / 0.55)), L = ['Q', 'S', 'M', 'E'][k], b = B[L];
    var x0 = 160 + b[0] * sc + 10, w = (b[2] - b[0]) * sc - 20;
    car.style.left = x0 + 'px'; car.style.width = w + 'px';
    car.style.opacity = t > 2.2 ? 0 : (Math.floor(t * 4) % 2 === 0 ? 1 : 0.25);
  });
  Kit.add('#head', 'opacity', [[0, 1], [2.3, 1], [2.6, 0.35]]);
  // Q and S lift out of the wordmark and spell it out
  var qc = WG.Qc, scQ = [WG.Sc[0], WG.Sc[1]];
  Kit.add('#bigQ', 'opacity', [[2.3, 0], [2.36, 1]]); Kit.add('#bigS', 'opacity', [[2.36, 0], [2.42, 1]]);
  Kit.add('#bigQ', 'x', [[2.3, qc[0] - 195], [2.62, 0, 'out']]); Kit.add('#bigQ', 'y', [[2.3, qc[1] - 1022], [2.62, 0, 'out']]); Kit.add('#bigQ', 'scale', [[2.3, 0.9], [2.62, 1, 'out']]);
  Kit.add('#bigS', 'x', [[2.36, scQ[0] - 185], [2.68, 0, 'out']]); Kit.add('#bigS', 'y', [[2.36, scQ[1] - 1154], [2.68, 0, 'out']]); Kit.add('#bigS', 'scale', [[2.36, 0.9], [2.68, 1, 'out']]);
  Kit.type('#rQ', 2.6, 2.82); Kit.type('#rS', 2.78, 3.0);   // 'Quantity / Surveying' complete by 3.0, held to 4.1
  Kit.add('#sName', 'opacity', [[4.1, 1], [4.25, 0]]);

  /* ---------- 4.2 – 6.8: Good QS, good project ---------- */
  Kit.scene('#sGood', 4.2, 6.85);
  Kit.slam('#good1', 4.28, { from: 1.35, dur: 0.15 }); Kit.add('#good1', 'rotate', [[4.28, -3], [4.45, -1.2, 'out']]);
  Kit.slam('#good2', 4.95, { from: 1.35, dur: 0.15 }); Kit.add('#good2', 'rotate', [[4.95, 2.5], [5.1, 0.8, 'out']]);
  Kit.add('#goodAside', 'opacity', [[5.75, 0], [5.88, 1]]); Kit.add('#goodAside', 'x', [[5.75, 40], [6.0, 0, 'out']]); Kit.add('#goodAside', 'rotate', [[5.75, -6], [6.0, -3, 'out']]);
  Kit.add('#sGood', 'opacity', [[6.65, 1], [6.85, 0]]);

  /* ---------- 6.8 – 10.0: the alphabet, shuffled ---------- */
  Kit.scene('#sAZ', 6.8, 10.05);
  var A = QSA.strip($('stripA'), { cols: 13, rowGap: 150, bigNums: true });
  A.el.style.transformOrigin = '0 0'; Kit.add(A.el, 'scale', [[0, 0.94]]);
  QSA.LETTERS.forEach(function (L, i) { Kit.show(A.tiles[L], 6.82 + i * 0.026); });
  var spans = QSA.flicker(A, QSA.LETTERS, 7.6, 0.3, 0.01, 7);
  spans.forEach(function (s) {
    var t = A.tiles[s.L], k = QSA.ORDER.indexOf(s.L);
    if (k >= 0) {
      Kit.add(t, 'background', [[0, '#121C17'], [s.b, '#3DC023', 'hold']]); Kit.add(t, 'borderColor', [[0, '#213128'], [s.b, '#3DC023', 'hold']]); Kit.add(t, 'color', [[0, '#EEF4EF'], [s.b, '#06130A', 'hold']]);
      var n = A.nums[s.L], tn = 8.1 + k * 0.07; Kit.add(n, 'opacity', [[tn, 0], [tn + 0.06, 1]]); Kit.add(n, 'scale', [[tn, 0.4], [tn + 0.18, 1, 'outBack']]);
    } else if (s.L === 'Q' || s.L === 'S') {
      Kit.add(t, 'color', [[0, '#EEF4EF'], [s.b, '#4BCD32', 'hold']]); Kit.add(t, 'borderColor', [[0, '#213128'], [s.b, '#3DC023', 'hold']]); Kit.add(t, 'background', [[0, '#121C17'], [s.b, '#10240F', 'hold']]);
    } else { Kit.add(t, 'color', [[0, '#EEF4EF'], [s.b, '#33433A', 'hold']]); Kit.add(t, 'borderColor', [[0, '#213128'], [s.b, '#18241D', 'hold']]); }
  });
  Kit.add('#big7', 'opacity', [[8.9, 0], [9.0, 1]]); Kit.add('#big7', 'scale', [[8.9, 0.2], [9.25, 1, 'outBack']]);
  Kit.add(A.tiles.A, 'scale', [[8.9, 1], [9.05, 1.22, 'out'], [9.3, 1, 'out']]); Kit.add(A.nums.A, 'scale', [[8.9, 1], [9.05, 1.6, 'out']]);
  Kit.add('#sAZ', 'opacity', [[9.85, 1], [10.05, 0]]);

  /* ---------- 10.0 – 22.6: nine letters ---------- */
  QSA.cutLetters({
    root: $('letters'), L0: 10.0, zAt: 22.6,
    dock: { x: 150, y: 314, s: 780 / 1656 },
    eye: { x: 150, y: 392, fs: 19 },
    giant: { x: 152, y: 432, fs: 240 },
    desc: { x: 380, y: 452, w: 550, fs: 40 },
    aside: { x: 340, y: 548, fs: 36 },
    seven: { x: 360, y: 520, fs: 86 },
    stamp: { x: 620, y: 530, fs: 50 },
    mom: { x: 150, y: 660, s: 1.0 },
    note: { right: 150, y: 610, fs: 22 },   // B's 'All totals excl. tax': above the window, never inside it
    cap: cap
  });

  /* ---------- 22.6 – 25.6: Z ---------- */
  Kit.scene('#sZ', 22.6, 25.65);
  Kit.slam('#gz', 22.65, { from: 1.5, dur: 0.14 });
  Kit.add('#gz', 'opacity', [[23.3, 1], [23.5, 0]]);
  var W2 = QSA.wordmark($('wmHost2'), { x: 170, y: 420, w: 740 });
  Kit.add(W2.Q, 'opacity', [[23.4, 0], [23.55, 1]]); Kit.add(W2.S, 'opacity', [[23.46, 0], [23.6, 1]]);
  Kit.add(W2.Q, 'scale', [[23.4, 0.7], [23.65, 1, 'outBack']]); Kit.add(W2.S, 'scale', [[23.46, 0.7], [23.7, 1, 'outBack']]);
  Kit.add(W2.M, 'opacity', [[23.6, 0], [23.8, 1]]); Kit.add(W2.E, 'opacity', [[23.68, 0], [23.88, 1]]);
  Kit.add(W2.Uw, 'width', [[23.6, W2.UwFrom], [24.0, W2.UwTo, 'inOut']]);
  Kit.pop('#built', 23.95);
  Kit.add('#sZ', 'opacity', [[25.45, 1], [25.65, 0]]);
  var br = mk($('brollLayer'), '<div class="broll"><img><div class="shade" style="background:rgba(12,19,16,.55)"></div></div>');
  var bi = br.querySelector('img'); bi.style.filter = 'saturate(.5) brightness(.9) blur(5px)';
  Kit.scene(br, 23.55, 30.0); Kit.clip(bi, { dir: 'clips/dusk', t0: 23.55, fps: 30, ext: '.jpg', frames: 151, speed: 0.7 });
  Kit.add(br, 'opacity', [[23.55, 0], [23.95, 0.32, 'out']]);
  Kit.add('#tagFoot', 'opacity', [[0, 0], [23.6, 0, 'hold'], [23.75, 1]]);   // after the docked strip has faded (23.4–23.6)

  /* ---------- 25.6 – 30.0: end card ---------- */
  Kit.scene('#sEnd', 25.6, 30.1);
  var W3 = QSA.wordmark($('wmHost3'), { x: 300, y: 360, w: 480 });
  Kit.add(W3.el, 'opacity', [[25.65, 0], [25.9, 1]]);
  Kit.add('#endPill', 'opacity', [[25.75, 0], [25.9, 1]]); Kit.add('#endPill', 'scale', [[25.75, 0.85], [26.0, 1, 'outBack']]);
  Kit.pop('#endUrl', 26.05); Kit.pop('#endSub', 26.7);

  Kit.ready({ duration: DUR, fonts: ['700 50px "Space Grotesk"', '500 20px Inter', '700 20px Inter', '500 20px "JetBrains Mono"', '700 40px Kalam', '400 30px "Permanent Marker"'] });
})();
</script>
</body>
</html>

    steps.forEach(function (q, i) { if (q[1]) Kit.add('#' + id, 'opacity', [[q[0] - 0.001, i ? 1 : 0], [q[0], 0.15, 'hold'], [q[0] + 0.22, 1, 'out']]); });
  }

  // scenes
  var T = { s2: c('usual') - 0.1, s4: c('reg') - 0.1, s5: c('match') - 0.1, s6: c('brief') - 0.1, s7: c('team') - 0.1, s8: c('rules') - 0.1, s9: c('alone') - 0.1, s10: c('bc') - 0.1 };

     .scene('#s7', T.s7, T.s8).scene('#s8', T.s8, T.s9).scene('#s9', T.s9, T.s10).scene('#s10', T.s10, D);

  // S1 hook: "Property development," then "backwards." arrives mirrored and flips round
  Kit.slam('#h1', 0.0, { from: 1.15 });

  [['c1', 'u1'], ['c2', 'u2'], ['c3', 'u3'], ['c4', 'buyers']].forEach(function (p) { Kit.pop('#' + p[0], c(p[1]), { dy: 18 }); });
  // the old order fades right back once "the people" lands, so it never reads as People → Price

  // the reversal runs in the pause after "buyers", so "Build Circle starts…" lands on a chain that already reads backwards

    // the cards pass below the line (never up through the caption), each at its own depth so they don't pile up
    var dx = SLOT[4 - i] - SLOT[i - 1], lift = [-30, 0, 100, 200][i - 1], f0 = F0 + (i === 2 || i === 3 ? 0.15 : 0), f1 = f0 + 1.1;

  });
  Kit.add('#bcl', 'opacity', [[c('flip'), 0], [c('flip') + 0.3, 1, 'out']]).add('#bcl', 'y', [[c('flip'), -16], [c('flip') + 0.3, 0, 'out']]);
  Kit.each(function (t) {
    var on = t >= c('ppl'), n = document.getElementById('c4'), l = document.getElementById('c4l'), s = on ? STR.n_people : STR.n_buyers;
    if (l.textContent !== s) l.textContent = s;

  });
  Kit.add('#c4', 'scale', [[c('ppl'), 1], [c('ppl') + 0.2, 1.08, 'out'], [c('ppl') + 0.55, 1.04, 'out']]);

  Kit.pop('#cap4', T.s4 + 0.05, { dy: 12 });
  [['fd1', 'fv1', 'w1'], ['fd2', 'fv2', 'w2'], ['fd3', 'fv3', 'w3']].forEach(function (p, i) {

  });

  // S5 interest gathers in one place (illustrative dots, no counts, no names), then the circle

  var map = document.getElementById('nzmap'), PING = [585, 318];
  var ping = document.getElementById('ping'); ping.style.left = (PING[0] / 8) + '%'; ping.style.top = (PING[1] / 11.41) + '%';
  var HOMES = [[496, 136, 1], [524, 231, 1], [557, 310, 1], [616, 304, 1], [621, 342, 1], [607, 387, 1], [476, 416, 0], [660, 457, 1], [573, 526, 0], [518, 604, 1], [424, 601, 0], [384, 791, 0], [260, 990, 0], [149, 924, 0], [735, 391, 0], [301, 865, 0]];
  HOMES.forEach(function (h, i) {
    var d = document.createElement('div'); d.className = 'hh'; d.id = 'hh' + i;
    var jx = ((i * 37) % 21) - 10, jy = ((i * 53) % 25) - 12;

    map.appendChild(d);

      Kit.each(function (t) {
        var p = Math.max(0, Math.min(1, (t - t0) / 0.9)); p = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        d.style.left = ((sx + (PING[0] - sx) * p) / 8) + '%'; d.style.top = ((sy + (PING[1] - sy) * p) / 11.41) + '%';

  Kit.add('#nzmap', 'opacity', [[T.s5, 0], [T.s5 + 0.4, 1, 'out'], [c('circ') - 0.25, 1], [c('circ') + 0.15, 0, 'in']]);
  Kit.add('#nzmap', 'scale', [[c('circ') - 0.25, 1], [c('circ') + 0.15, 0.8, 'in']]);
  Kit.scene('#tagm', T.s5, c('circ') + 0.2);
  Kit.add('#circ', 'opacity', [[0, 0], [c('circ') - 0.05, 0, 'hold'], [c('circ') + 0.25, 1, 'out']]);

  ['#cd1', '#cd2', '#cd3'].forEach(function (s, i) { Kit.add(s, 'opacity', [[0, 0], [c('circ') + 0.2 + i * 0.18, 0, 'hold'], [c('circ') + 0.32 + i * 0.18, 1, 'out']]); });
  Kit.each(function (t) { document.getElementById('cr').setAttribute('transform', 'rotate(' + (t * 14) + ' 10 10)'); });
  Kit.pop('#ca', c('circ') + 0.2, { dy: 10 }).slam('#cb', c('ftd'), { from: 1.12 });

  // S6 then one brief, and one site
  Kit.pop('#g6', T.s6 + 0.05, { dy: 0 }).pop('#f1', T.s6 + 0.1, { dy: 12 });
  Kit.pop('#f2', c('b1'), { dy: 16 }).pop('#f3', c('site'), { dy: 16 });
  document.querySelectorAll('#fbox .arw').forEach(function (e, i) { Kit.add(e, 'opacity', [[0, 0], [[c('b1') - 0.15, c('site') - 0.15][i], 0, 'hold'], [[c('b1'), c('site')][i], 1, 'out']]); });
  Kit.each(function (t) { document.getElementById('f2').classList.toggle('lit', t >= c('b1') + 0.35); document.getElementById('f3').classList.toggle('lit', t >= c('site') + 0.35); });

  // S7 the right team: five empty places around the circle, filled one by one as they're named
  Kit.pop('#cap7', T.s7 + 0.05, { dy: 12 });
  Kit.add('#tring', 'scale', [[T.s7, 0.7], [T.s7 + 0.45, 1, 'outBack']]);
  var RO = [[500, 62], [772, 238], [688, 560], [312, 560], [228, 238]];
  RO.forEach(function (p, i) {
    // lines stop at each chip's edge: the side chips sit close to the ring's height, so their lines stop further out
    var k = 'r' + (i + 1), dx = p[0] - 500, dy = p[1] - 330, L = Math.sqrt(dx * dx + dy * dy), r0 = 120, r1 = L - (Math.abs(dy) < 150 ? 112 : 50);
    var x0 = 500 + dx / L * r0, y0 = 330 + dy / L * r0, x1 = 500 + dx / L * r1, y1 = 330 + dy / L * r1;
    var g = document.createElementNS(NS, 'linearGradient'); g.id = 'tg' + i; g.setAttribute('gradientUnits', 'userSpaceOnUse');
    g.setAttribute('x1', x0); g.setAttribute('y1', y0); g.setAttribute('x2', x1); g.setAttribute('y2', y1);
    g.innerHTML = '<stop offset="0" stop-color="#4fb8ff"/><stop offset="1" stop-color="#a98bff"/>';
    document.getElementById('tdefs').appendChild(g);
    var ln = document.createElementNS(NS, 'path'); ln.setAttribute('d', 'M' + x0 + ' ' + y0 + ' L' + x1 + ' ' + y1);
    ln.setAttribute('stroke', 'url(#tg' + i + ')'); ln.setAttribute('stroke-width', '3.5'); ln.setAttribute('stroke-linecap', 'round'); ln.setAttribute('fill', 'none');
    document.getElementById('tlines').appendChild(ln);
    Kit.add(ln, 'trim', [[c(k) - 0.1, 0], [c(k) + 0.35, 1, 'out']]);
    Kit.pop('#ro' + (i + 1), c('team') + 0.6 + i * 0.12, { dy: 0 });
    Kit.add('#ro' + (i + 1), 'opacity', [[c('team') + 0.6 + i * 0.12, 0], [c('team') + 0.9 + i * 0.12, 0.55, 'out'], [c(k), 0.55], [c(k) + 0.15, 1, 'out']]);
    Kit.add('#ro' + (i + 1), 'scale', [[c(k), 1], [c(k) + 0.15, 1.12, 'out'], [c(k) + 0.45, 1, 'out']]);
    Kit.each(function (t) { document.getElementById('ro' + (i + 1)).classList.toggle('on', t >= c(k)); });
  });

  // S8 on QSME: the rules light up as they're named, then every cost line on one open book
  caption('cap8', [[T.s8, ''], [c('rules') + 0.05, STR.cap_rules], [c('book') + 0.05, STR.cap_book]]);
  Kit.pop('#pA', T.s8 + 0.15, { dy: 18 });
  [['ru1', 'cons'], ['ru2', 'insp'], ['ru3', 'ccc']].forEach(function (p) { Kit.each(function (t) { document.getElementById(p[0]).classList.toggle('on', t >= c(p[1]) + 0.1); }); });
  Kit.add('#pB', 'opacity', [[T.s8 + 0.3, 0], [T.s8 + 0.6, 0.25, 'out'], [c('book') - 0.1, 0.25], [c('book') + 0.25, 1, 'out']]);
  [1, 2, 3, 4].forEach(function (i) { Kit.each(function (t) { document.getElementById('bl' + i).classList.toggle('on', t >= c('book') + 0.5 + (i - 1) * 0.35); }); });

  // S9 not worked out alone: the circle with its team around it
  Kit.pop('#cap9', T.s9 + 0.05, { dy: 14 });
  (function () {
    var orbit = document.getElementById('orbit'), al = document.getElementById('alines');
    for (var i = 0; i < 5; i++) {
      var d = document.createElement('div'); d.className = 'ab'; d.id = 'od' + i;
      d.innerHTML = '<div id="odi' + i + '" style="width:30px;height:30px;border-radius:50%;background:#a98bff;box-shadow:0 0 0 8px rgba(169,139,255,.18),0 0 22px rgba(169,139,255,.6)"></div>';
      orbit.appendChild(d);
      var ln = document.createElementNS(NS, 'line'); ln.id = 'ol' + i; ln.setAttribute('stroke', 'rgba(169,139,255,.45)'); ln.setAttribute('stroke-width', '2.5');
      al.appendChild(ln);
      Kit.add(ln, 'opacity', [[0, 0], [T.s9 + 0.3 + i * 0.12, 0, 'hold'], [T.s9 + 0.45 + i * 0.12, 1, 'out']]);
      Kit.pop('#odi' + i, T.s9 + 0.3 + i * 0.12, { dy: 0 });
    }
    Kit.each(function (t) {
      for (var i = 0; i < 5; i++) {
        var a = (-90 + i * 72 + (t - T.s9) * 9) * Math.PI / 180, x = 500 + 190 * Math.cos(a), y = 220 + 190 * Math.sin(a);
        var d = document.getElementById('od' + i); d.style.left = x + 'px'; d.style.top = y + 'px';
        var ln = document.getElementById('ol' + i), k = 105 / 190;
        ln.setAttribute('x1', 500 + (x - 500) * k); ln.setAttribute('y1', 220 + (y - 220) * k); ln.setAttribute('x2', x); ln.setAttribute('y2', y);
      }
    });
  })();
  Kit.pop('#ac1', c('org'), { dy: 14 }).pop('#ac2', c('bring'), { dy: 14 });

  // S10 end card
  Kit.add('#lk', 'scale', [[T.s10, 0.88], [T.s10 + 0.5, 1, 'outBack']]).fade('#lk', T.s10, T.s10 + 0.25);
  Kit.pop('#byb', c('bybq'), { dy: 12 }).pop('#nzc', c('nz'), { dy: 12 }).pop('#wh', c('cta'), { dy: 12 });
  Kit.pop('#btn', c('url'), { dy: 14 }).add('#btn', 'scale', [[c('url'), 0.92], [c('url') + 0.3, 1, 'outBack']]);
  Kit.fade('#disc', c('cta') + 0.3, c('cta') + 0.7);

  Kit.ready({ duration: D });
</script>

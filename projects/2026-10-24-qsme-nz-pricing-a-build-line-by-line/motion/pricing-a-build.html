<style>

  .caption .g { color: #15803D; } .caption .p { color: #6D28D9; } .caption .r { color: #B91C1C; }

  /* HUD */
  .chap { position: absolute; left: 160px; top: 54px; display: flex; align-items: center; gap: 14px; height: 46px; padding: 0 20px 0 8px; border-radius: 999px; z-index: 55;
    background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.14); font: 700 25px/1 Manrope; color: #F8FAFC; letter-spacing: -0.01em; white-space: nowrap; }
  .chap b { display: inline-flex; align-items: center; justify-content: center; height: 32px; min-width: 48px; padding: 0 8px; border-radius: 999px; background: #16A34A; color: #fff; font: 700 18px/1 "JetBrains Mono"; }
  .lbl { position: absolute; right: 160px; top: 60px; padding: 6px 14px; border-radius: 8px; font: 500 20px/1.2 "JetBrains Mono"; white-space: nowrap; z-index: 55; }
  .lbl.ill { border: 2px dashed rgba(248,250,252,.55); color: rgba(248,250,252,.78); background: rgba(2,6,23,.55); }
  .lbl.live { border: 2px solid rgba(61,192,35,.75); color: #BBF7D0; background: rgba(2,6,23,.6); display: flex; align-items: center; gap: 10px; }
  .lbl.live i { width: 10px; height: 10px; border-radius: 50%; background: #3DC023; box-shadow: 0 0 0 4px rgba(61,192,35,.25); }
  .lbl.drm { border: 2px solid rgba(248,250,252,.35); color: rgba(248,250,252,.82); background: rgba(2,6,23,.5); }

  .ftag.l { left: 160px; } .ftag.r { right: 160px; }
  .ftag b { color: inherit; font-weight: inherit; }   /* 'Paid plans' stays as a disclosure, in the same neutral grey */

  /* the app window */
  .win { position: absolute; left: 160px; top: 118px; width: 1600px; height: 750px; border-radius: 18px; overflow: hidden; background: #F4F6F5; z-index: 20;
    box-shadow: 0 36px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.1); }

  .hl { position: absolute; left: 96px; right: 96px; top: 74px; text-align: center; font: 800 112px/1.04 Manrope; letter-spacing: -0.035em; color: #F8FAFC; z-index: 50; text-shadow: 0 6px 30px rgba(2,6,23,.55); }
  .hl .a { color: #3DC023; }
  .full { position: absolute; inset: 0; overflow: hidden; }
  .full img.f { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .lcam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; --cx: 960; --cy: 540; --cs: 1;
    transform: translate(calc(960px - var(--cs) * var(--cx) * 1px), calc(540px - var(--cs) * var(--cy) * 1px)) scale(var(--cs)); }
  .wl { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; --cx: 800; --cy: 450; --cs: 1;
    transform: translate(calc(800px - var(--cs) * var(--cx) * 1px), calc(375px - var(--cs) * var(--cy) * 1px)) scale(var(--cs)); }
  .veil { position: absolute; backdrop-filter: blur(9px) brightness(.55); -webkit-backdrop-filter: blur(9px) brightness(.55); border-radius: 10px; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(2,6,23,.75) 0%, rgba(2,6,23,.15) 32%, rgba(2,6,23,0) 60%, rgba(2,6,23,.45) 100%); }

  #title { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 40; }
  #title .l1 { font: 800 168px/1 Manrope; letter-spacing: -0.045em; color: #F8FAFC; }
  #title .l2 { font: 800 56px/1.15 Manrope; letter-spacing: -0.025em; color: #3DC023; margin-top: 26px; }
  #title .l3 { font: 500 24px/1.3 "JetBrains Mono"; color: rgba(248,250,252,.62); margin-top: 34px; }

  .sc { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px 0 8px; border-radius: 999px; background: rgba(2,6,23,.85); border: 1.5px solid rgba(255,255,255,.18); font: 700 23px/1 Manrope; color: #F8FAFC; white-space: nowrap; }
  .sc b { display: inline-flex; align-items: center; justify-content: center; height: 34px; min-width: 44px; border-radius: 999px; background: #16A34A; color: #fff; font: 700 17px/1 "JetBrains Mono"; }
  .wstk { position: absolute; z-index: 45; font-size: 40px; }

  /* split */
  .phd.l { color: #BBF7D0; } .phd.l i { background: #3DC023; }
  .phd.r { color: #FDE68A; } .phd.r i { background: #F59E0B; }

  /* end card */
  #end .bg { position: absolute; inset: -40px; background-size: cover; background-position: 60% 50%; transform-origin: 62% 50%; }
  #end .ov { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(2,6,23,.96) 0%, rgba(2,6,23,.88) 38%, rgba(2,6,23,.35) 70%, rgba(2,6,23,.15) 100%), linear-gradient(0deg, rgba(2,6,23,.6), rgba(2,6,23,0) 40%); }
  #end .e1 { position: absolute; left: 160px; top: 352px; font: 800 120px/1 Manrope; letter-spacing: -0.045em; color: #F8FAFC; white-space: nowrap; }
  #end .e2 { position: absolute; left: 160px; top: 492px; font: 800 72px/1.05 Manrope; letter-spacing: -0.035em; color: #3DC023; white-space: nowrap; }
  #end .btnx { position: absolute; left: 160px; top: 636px; display: inline-flex; align-items: center; gap: 18px; height: 96px; padding: 0 40px; border-radius: 14px; background: #16A34A; color: #fff; font: 800 46px/1 Manrope; letter-spacing: -0.01em; white-space: nowrap; box-shadow: 0 20px 50px rgba(22,163,74,.35); }
  #end .logo { position: absolute; left: 160px; top: 214px; width: 300px; }
  #end .fn { position: absolute; left: 160px; bottom: 74px; font: 500 20px/1.3 "JetBrains Mono"; color: rgba(248,250,252,.6); white-space: nowrap; }

<body class="nz r16x9">
<div id="root"></div>
<script src="../../../tools/motion/kit.js"></script>
<script src="ui.js"></script>
<script src="story.js"></script>
<script>
(function () {
  'use strict';
  var R = document.getElementById('root'), H = '';
  function add(h) { H += h; }
  var caps = [];
  function cap(t0, t1, html) { caps.push([t0, t1, html]); }
  function capsFrom(ch, T) { ch.caps.forEach(function (c) { cap(T + c[0], T + c[1], c[2]); }); }

  /* ---------------- master clock (review 2026-10-04) ----------------
     cold open 0–4.6 · trench 4.6–6.9 · title 6.9–10.5 · setup 10.5–20.8
     01 Read the pack: lead-in W1, CH1 at T1 · drainage arrives TB3 · read in T5a
     02 Price it: lead-in W2, CH2 at T2 · 03 Fill the gaps T3 · 04 Tender it T5b · 05 What bidders see T6 · end TE */
  var TT = 4.6, TTi = 6.9, TS = 10.5, W1 = 20.8, T1 = 22.3, TB3 = 40.8, T5a = 44.8, W2 = 49.0, T2 = 50.8, T3 = 72.0, T5b = 94.0, T6 = 114.8, TE = 128.4, D = 135.4;

  /* ---------- COLD OPEN (0 – 4.6): the pack is already down at frame 0; the notice slides in by 0.3 s ---------- */
  add(Story.bench('b1', { px: 470, py: 276, rot: -3, top: true }));
  add('<div id="n1" class="abs" style="left:400px;top:650px;z-index:30">' + UI.note('n1in', 'n1mk', 'big') + '</div>');
  add('<div id="h1" class="hl">Found before the tender.</div>');
  add('<div id="lb1" class="lbl drm" style="left:110px;right:auto;top:auto;bottom:62px">Dramatised · demo pack · illustrative screens</div>');

  /* ---------- trench b-roll (4.6 – 6.9): the gap was found BEFORE, so: not in a trench (accent on "Not") ---------- */
  add('<div id="tr" class="full"><div id="trcam" class="lcam"><img id="trimg" class="f" alt=""></div><div class="shade"></div>' +
      '<div class="hl" style="top:74px"><span class="a">Not</span> in a trench.</div>' +
      '<div class="lbl ill" style="top:auto;bottom:62px;right:110px">Illustrative b-roll</div></div>');

  /* ---------- TITLE (6.9 – 10.5) ---------- */
  add('<div id="title" class="fill"><div id="t1" class="l1">Price it once.</div><div id="t2" class="l2">From the consent pack to one scope every trade prices.</div>' +
      '<div id="t3" class="l3">A QSME walkthrough · Dramatised · illustrative screens · demo data</div></div>');

  /* ---------- SETUP (10.5 – 20.8) ---------- */
  add(Story.bench('b2', { px: 250, py: 250, rot: -3, sticky: [960, 196, 'CHCH build'], xls: [1250, 220], top: true,
    extra: '<div id="b2q" class="mkr" style="left:1330px;top:760px;font-size:58px;transform:rotate(6deg)">drainage??</div>' }));
  var CH = ['Read the pack', 'Price it', 'Fill the gaps', 'Tender it', 'What bidders see'];
  add('<div id="strip">' + CH.map(function (s, i) { return '<div id="sc' + i + '" class="sc"><b>0' + (i + 1) + '</b>' + s + '</div>'; }).join('') + '</div>');

  /* ---------- DRAINAGE ARRIVES (bench, TB3 – T5a): straight after she asks the designer ---------- */
  add(Story.bench('b3', { px: 210, py: 300, rot: -3, sticky: [1010, 150, 'ask designer:<br>drainage sheets!', -4], drain: [960, 360],
    extra: '<svg id="b3tk" class="abs" style="left:1312px;top:150px;width:120px;height:110px" viewBox="0 0 120 110"><path id="b3tkp" d="M10 60 L 44 92 L 110 12" fill="none" stroke="#15803D" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>' }));

  /* ---------- the app window: one .wcam per chapter ---------- */
  add('<div id="win" class="win">' + Story.ch1.html('c1') + Story.ch5a.html('c5a') + Story.ch2.html('c2') + Story.ch3.html('c3') + Story.ch5b.html('c5b') + '</div>');
  add('<div id="stk1" class="stk wstk" style="left:1250px;top:610px;transform:rotate(-4deg)">ask designer:<br>drainage sheets!</div>');

  /* ---------- SPLIT: her SOQ vs what the drainlayer sees (T6 – TE) ---------- */
  var G = { L: [150, 160], R: [990, 160], s: 1 };
  add('<div id="spl" class="fill"><div class="phd l" style="left:152px;top:118px"><i></i>Her SOQ</div><div class="phd r" style="left:992px;top:118px"><i></i>What the drainlayer sees</div>' + Story.split.html('sp', G) + '</div>');

  /* ---------- END CARD (TE – D): text kept in the left half, the right half is clear for YouTube end-screen elements ---------- */
  add('<div id="end" class="fill"><div id="ebg" class="bg" style="background-image:url(clips/dusk/f_00000.jpg)"></div><div class="ov"></div>' +
      '<div id="elogo" class="logo" style="width:239px;height:137px;overflow:hidden"><img src="qsme-logo.svg" alt="QSME" style="position:absolute;left:-35px;top:0;width:300px"></div><div id="e1" class="e1">Price it once.</div><div id="e2" class="e2">Tender the same lines.</div>' +
      '<div id="ebtn" class="btnx">Sign up at qsme.co.nz</div><div id="efn" class="fn">Dramatised · illustrative screens · demo data · illustrative b-roll</div></div>');

  /* ---------- HUD ---------- */
  CH.forEach(function (s, i) { add('<div id="chap' + i + '" class="chap"><b>0' + (i + 1) + '</b>' + s + '</div>'); });
  add('<div id="lbI" class="lbl ill">Illustrative screen · demo data</div>');
  add('<div id="lbD" class="lbl drm">Dramatised</div>');
  add('<div id="tg1" class="ftag l"><b>Paid plans</b> · uses AI credits (1 per 10 pages)</div>');
  add('<div id="tg2" class="ftag r">Reads what the drawings say. Doesn\'t measure them.</div>');
  add('<div id="tg3" class="ftag l"><b>Paid plans</b> · uses AI credits</div>');
  add('<div id="tg4" class="ftag r">AI rates are indicative, not quotes. QSME doesn\'t supply rates.</div>');
  add('<div id="tg5" class="ftag l"><b>Paid plans</b> · uses AI credits (1 per 10 pages)</div>');
  add('<div id="tg6" class="ftag r" style="right:150px">They can itemise or quote one total.</div>');

  /* ---------- captions ---------- */
  var ARR = '<svg viewBox="0 0 24 24" style="width:.62em;height:.62em;margin-left:.12em;vertical-align:-.02em" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 L17 7 M9 7 H17 V15"/></svg>';
  cap(TS + 0.4, TS + 4.6, 'Christchurch owner-builder. Consent pack thick enough to prop a door open.');
  cap(TS + 4.9, TS + 8.05, 'And her brother-in-law\'s spreadsheet. From two years ago.');
  cap(TS + 8.3, TS + 10.2, 'Neither one mentions <span class="r">drainage</span>.');
  cap(W1 + 0.2, T1 + 0.95, 'Step 1: read the pack.');
  capsFrom(Story.ch1, T1);
  cap(TB3 + 0.3, TB3 + 3.9, 'Days later: the drainage sheets, as their own PDF.');
  capsFrom(Story.ch5a, T5a);
  cap(W2 + 0.15, T2 + 0.15, 'Step 2: price it.');
  capsFrom(Story.ch2, T2);
  capsFrom(Story.ch3, T3);
  capsFrom(Story.ch5b, T5b);
  cap(T6 + 0.4, T6 + 5.2, 'Same lines for every bidder. Her rates never shown.');
  cap(T6 + 5.4, T6 + 9.0, 'Rates and budget are stripped before a bidder sees it.');
  cap(T6 + 9.2, T6 + 13.5, 'Comparing the totals on the same GST basis?<br>That video\'s linked here' + ARR);
  caps.forEach(function (c, i) { add('<div id="cap' + i + '" class="caption box"><span>' + c[2] + '</span></div>'); });
  R.innerHTML = H;

  /* ================= TIMELINE ================= */
  Kit.scene('#b1', 0, TT).scene('#n1', 0, TT).scene('#h1', 0, TT).scene('#lb1', 0, TTi);
  Kit.scene('#tr', TT, TTi).scene('#title', TTi, TS).scene('#b2', TS, W1).scene('#strip', TS + 9.0, W1);
  Kit.scene('#b3', TB3, T5a).scene('#spl', T6, TE).scene('#end', TE, D + 1);
  // the window shows in two stretches (the drainage bench sits between them)
  Kit.add('#win', 'opacity', [[0, 0], [W1, 1, 'hold'], [TB3, 0, 'hold'], [T5a, 1, 'hold'], [T6, 0, 'hold']]);
  Kit.add('#win', 'scale', [[W1, 0.97], [W1 + 0.35, 1, 'out'], [T5a, 0.97, 'hold'], [T5a + 0.35, 1, 'out']]);
  Kit.scene('#c1', W1, TB3).scene('#c5a', T5a, W2).scene('#c2', W2, T3).scene('#c3', T3, T5b).scene('#c5b', T5b, T6);
  Story.ch1.anim('c1', T1); Story.ch5a.anim('c5a', T5a); Story.ch2.anim('c2', T2); Story.ch3.anim('c3', T3); Story.ch5b.anim('c5b', T5b);
  Story.split.anim('sp', T6, G);
  Kit.add('#spl', 'scale', [[T6 + 4.8, 1], [TE, 1.025, 'linear']]);   // a slow push while the last captions read

  // HUD
  var chT = [[W1 + 0.05, W2], [W2, T3], [T3, T5b], [T5b, T6], [T6, TE]];
  chT.forEach(function (r, i) { Kit.scene('#chap' + i, r[0], r[1]); Kit.add('#chap' + i, 'x', [[r[0], -16], [r[0] + 0.25, 0, 'out']]); });
  Kit.add('#lbI', 'opacity', [[0, 0], [W1, 1, 'hold'], [TB3, 0, 'hold'], [T5a, 1, 'hold'], [TE, 0, 'hold']]);
  Kit.scene('#lbD', TB3, T5a);
  Kit.scene('#tg1', T1 + 0.4, TB3).scene('#tg2', T1 + 0.4, TB3);
  Kit.scene('#tg3', T3 + 1.5, T5b).scene('#tg4', T3 + 7.4, T5b).scene('#tg5', T5a + 0.3, W2).scene('#tg6', T6 + 2.0, T6 + 9.1);   // off before the two-line caption
  Kit.scene('#stk1', T1 + 15.8, TB3);
  Kit.add('#stk1', 'opacity', [[T1 + 15.8, 0], [T1 + 15.85, 1]]).add('#stk1', 'scale', [[T1 + 15.8, 1.3], [T1 + 15.96, 1, 'slam']]);

  // cold open: frame 0 = pack down + headline; a short settle shake; the notice is in by 0.3 s
  Kit.add('#b1cam', 'x', [[0, -6], [0.06, 5], [0.13, -3], [0.2, 2], [0.28, 0]]).add('#b1cam', 'y', [[0, 5], [0.07, -4], [0.15, 2], [0.26, 0]]);
  Kit.add('#b1cam', 'scale', [[0.3, 1], [TT, 1.07, 'inOut']]);
  Kit.add('#h1', 'scale', [[0, 1.03], [0.3, 1, 'out']]);
  Kit.add('#n1', 'y', [[0, 90], [0.3, 0, 'out']]).add('#n1', 'opacity', [[0, 0], [0.14, 1]]);
  Kit.add('#n1mk', 'trim', [[1.0, 0], [1.5, 1, 'out']]);
  // trench
  Kit.clip('#trimg', { dir: 'clips/trench', t0: TT, fps: 30, ext: '.jpg', frames: 120 });
  Kit.add('#trcam', 'var:--cs', [[TT, 1.03], [TTi, 1.1]]);
  // title
  Kit.pop('#t1', TTi + 0.1, { dy: 30 }).pop('#t2', TTi + 0.5, { dy: 24 }).fade('#t3', TTi + 1.0, TTi + 1.4);
  Kit.add('#title', 'opacity', [[TS - 0.25, 1], [TS, 0]]);
  // setup
  Kit.add('#b2cam', 'scale', [[TS, 1.0], [W1, 1.06, 'inOut']]);
  Kit.add('#b2stk', 'opacity', [[TS + 0.65, 0], [TS + 0.7, 1]]).add('#b2stk', 'scale', [[TS + 0.65, 1.25], [TS + 0.82, 1, 'slam']]);
  Kit.add('#b2xw', 'x', [[TS + 4.4, 900], [TS + 4.82, 0, 'out']]).add('#b2xw', 'opacity', [[TS + 4.4, 0], [TS + 4.5, 1]]);
  Kit.add('#b2c24', 'trim', [[TS + 5.6, 0], [TS + 6.2, 1, 'out']]);
  Kit.add('#b2q', 'clipX', [[TS + 8.4, 0], [TS + 9.05, 1]]).add('#b2q', 'opacity', [[TS + 8.38, 0], [TS + 8.4, 1]]);
  for (var i = 0; i < CH.length; i++) Kit.pop('#sc' + i, TS + 9.05 + i * 0.08, { dy: -20 });
  // drainage arrives
  Kit.add('#b3cam', 'scale', [[TB3, 1.0], [T5a, 1.05, 'inOut']]);
  Kit.add('#b3dw', 'x', [[TB3 + 0.3, 1000], [TB3 + 0.85, 0, 'out']]).add('#b3dw', 'opacity', [[TB3 + 0.3, 0], [TB3 + 0.4, 1]]);
  Kit.add('#b3dw', 'rotate', [[TB3 + 0.3, 6], [TB3 + 0.85, 0, 'out']]);
  Kit.add('#b3tkp', 'trim', [[TB3 + 1.6, 0], [TB3 + 2.0, 1, 'out']]);
  // end card
  Kit.add('#ebg', 'scale', [[TE, 1.0], [D, 1.07, 'linear']]);
  Kit.add('#end', 'opacity', [[TE, 0], [TE + 0.35, 1]]);
  Kit.pop('#elogo', TE + 0.3, { dy: 20 }).pop('#e1', TE + 0.6, { dy: 30 }).pop('#e2', TE + 1.0, { dy: 30 }).pop('#ebtn', TE + 1.6, { dy: 24 }).fade('#efn', TE + 1.9, TE + 2.3);
  Kit.add('#ebtn', 'scale', [[TE + 3.2, 1], [TE + 3.4, 1.04, 'out'], [TE + 3.7, 1, 'inOut']]);

  // captions
  caps.forEach(function (c, i) { Kit.pop('#cap' + i, c[0], { dy: 18 }); Kit.out('#cap' + i, c[1] - 0.12, 0.12); });

  Kit.ready({ duration: D, fonts: ['800 60px Manrope', '500 20px Inter', '600 20px Inter', '700 20px Inter', '800 20px Inter', '400 40px Kalam', '400 40px "Permanent Marker"', '500 20px "JetBrains Mono"', '600 16px "JetBrains Mono"', '700 20px "JetBrains Mono"'] });
})();
</script>
</body>
</html>

    [T6 + 1.8, 130.10], [T6 + 3.6, 131.95], [T6 + 4.8, 132.90],   // rows travel, rates blur on "Her rates and her budget are stripped"
    [T6 + 9.2, 133.09],                       // "Comparing the totals..."

  ]);

  /* ================= TIMELINE ================= */
  Kit.scene('#b1', 0, TT).scene('#n1', 0, TT).scene('#h1', 0, TT).scene('#lb1', 0, TTi);
  Kit.scene('#tr', TT, TTi).scene('#title', TTi, TS).scene('#b2', TS, W1).scene('#strip', TS + 9.0, W1);
  Kit.scene('#b3', TB3, T5a).scene('#spl', T6, TE).scene('#end', TE, D + 1);
  // the window shows in two stretches (the drainage bench sits between them)
  Kit.add('#win', 'opacity', [[0, 0], [W1, 1, 'hold'], [TB3, 0, 'hold'], [T5a, 1, 'hold'], [T6, 0, 'hold']]);
  Kit.add('#win', 'scale', [[W1, 0.97], [W1 + 0.35, 1, 'out'], [T5a, 0.97, 'hold'], [T5a + 0.35, 1, 'out']]);
  Kit.scene('#c1', W1, TB3).scene('#c5a', T5a, W2).scene('#c2', W2, T3).scene('#c3', T3, T5b).scene('#c5b', T5b, T6);
  Story.ch1.anim('c1', T1); Story.ch5a.anim('c5a', T5a); Story.ch2.anim('c2', T2); Story.ch3.anim('c3', T3); Story.ch5b.anim('c5b', T5b);
  Story.split.anim('sp', T6, G);
  Kit.add('#spl', 'scale', [[T6 + 4.8, 1], [TE, 1.025, 'linear']]);   // a slow push while the last captions read

  // HUD
  var chT = [[W1 + 0.05, W2], [W2, T3], [T3, T5b], [T5b, T6], [T6, TE]];
  chT.forEach(function (r, i) { Kit.scene('#chap' + i, r[0], r[1]); Kit.add('#chap' + i, 'x', [[r[0], -16], [r[0] + 0.25, 0, 'out']]); });
  Kit.add('#lbI', 'opacity', [[0, 0], [W1, 1, 'hold'], [TB3, 0, 'hold'], [T5a, 1, 'hold'], [TE, 0, 'hold']]);
  Kit.scene('#lbD', TB3, T5a);
  Kit.scene('#tg1', T1 + 0.4, TB3).scene('#tg2', T1 + 0.4, TB3);
  Kit.scene('#tg3', T3 + 1.5, T5b).scene('#tg4', T3 + 7.4, T5b).scene('#tg5', T5a + 0.3, W2);   // (tg6 'They can itemise…' is now a caption on the words)
  Kit.scene('#stk1', T1 + 15.8, TB3);
  Kit.add('#stk1', 'opacity', [[T1 + 15.8, 0], [T1 + 15.85, 1]]).add('#stk1', 'scale', [[T1 + 15.8, 1.3], [T1 + 15.96, 1, 'slam']]);

  // cold open: frame 0 = pack down + headline; a short settle shake; the notice is in by 0.3 s
  Kit.add('#b1cam', 'x', [[0, -6], [0.06, 5], [0.13, -3], [0.2, 2], [0.28, 0]]).add('#b1cam', 'y', [[0, 5], [0.07, -4], [0.15, 2], [0.26, 0]]);
  Kit.add('#b1cam', 'scale', [[0.3, 1], [TT, 1.07, 'inOut']]);
  Kit.add('#h1', 'scale', [[0, 1.03], [0.3, 1, 'out']]);
  Kit.add('#n1', 'y', [[0, 90], [0.3, 0, 'out']]).add('#n1', 'opacity', [[0, 0], [0.14, 1]]);
  Kit.add('#n1mk', 'trim', [[1.0, 0], [1.5, 1, 'out']]);
  // trench
  Kit.clip('#trimg', { dir: 'clips/trench', t0: TT, fps: 30, ext: '.jpg', frames: 120 });
  Kit.add('#trcam', 'var:--cs', [[TT, 1.03], [TTi, 1.1]]);
  // title
  Kit.pop('#t1', TTi + 0.1, { dy: 30 }).pop('#t2', TTi + 0.5, { dy: 24 }).fade('#t3', TTi + 1.0, TTi + 1.4);
  Kit.add('#title', 'opacity', [[TS - 0.25, 1], [TS, 0]]);
  // setup
  Kit.add('#b2cam', 'scale', [[TS, 1.0], [W1, 1.06, 'inOut']]);
  Kit.add('#b2stk', 'opacity', [[TS + 0.65, 0], [TS + 0.7, 1]]).add('#b2stk', 'scale', [[TS + 0.65, 1.25], [TS + 0.82, 1, 'slam']]);
  Kit.add('#b2xw', 'x', [[TS + 4.4, 900], [TS + 4.82, 0, 'out']]).add('#b2xw', 'opacity', [[TS + 4.4, 0], [TS + 4.5, 1]]);
  Kit.add('#b2c24', 'trim', [[TS + 5.6, 0], [TS + 6.2, 1, 'out']]);
  Kit.add('#b2q', 'clipX', [[TS + 8.4, 0], [TS + 9.05, 1]]).add('#b2q', 'opacity', [[TS + 8.38, 0], [TS + 8.4, 1]]);
  for (var i = 0; i < CH.length; i++) Kit.pop('#sc' + i, TS + 9.05 + i * 0.08, { dy: -20 });
  // drainage arrives
  Kit.add('#b3cam', 'scale', [[TB3, 1.0], [T5a, 1.05, 'inOut']]);
  Kit.add('#b3dw', 'x', [[TB3 + 0.3, 1000], [TB3 + 0.85, 0, 'out']]).add('#b3dw', 'opacity', [[TB3 + 0.3, 0], [TB3 + 0.4, 1]]);
  Kit.add('#b3dw', 'rotate', [[TB3 + 0.3, 6], [TB3 + 0.85, 0, 'out']]);
  Kit.add('#b3tkp', 'trim', [[TB3 + 1.6, 0], [TB3 + 2.0, 1, 'out']]);
  // end card
  Kit.add('#ebg', 'scale', [[TE, 1.0], [D, 1.07, 'linear']]);
  Kit.add('#end', 'opacity', [[TE, 0], [TE + 0.35, 1]]);
  Kit.pop('#elogo', TE + 0.3, { dy: 20 }).pop('#e1', TE + 0.6, { dy: 30 }).pop('#e2', TE + 1.0, { dy: 30 }).pop('#ebtn', TE + 1.6, { dy: 24 }).fade('#efn', TE + 1.9, TE + 2.3);
  Kit.add('#ebtn', 'scale', [[TE + 3.2, 1], [TE + 3.4, 1.04, 'out'], [TE + 3.7, 1, 'inOut']]);

  // captions (output time)
  Warp.restore();
  caps.forEach(function (c, i) { Kit.pop('#cap' + i, c[0], { dy: 18 }); Kit.out('#cap' + i, c[1] - 0.12, 0.12); });

  Kit.ready({ duration: DOUT, fonts: ['800 60px Manrope', '500 20px Inter', '600 20px Inter', '700 20px Inter', '800 20px Inter', '400 40px Kalam', '400 40px "Permanent Marker"', '500 20px "JetBrains Mono"', '600 16px "JetBrains Mono"', '700 20px "JetBrains Mono"'] });
})();

<script>
  var C = CUES, RTL = document.documentElement.dir === 'rtl', SG = RTL ? -1 : 1, V = document.body.classList.contains('r9x16');
  function c(n) { if (!(n in C)) throw new Error('missing cue ' + n); return C[n]; }
  var D = Math.round((END + 3.4) * 10) / 10;
  document.querySelectorAll('[data-s]').forEach(function (el) {
    var k = el.getAttribute('data-s'); if (!(k in STR)) throw new Error('missing string ' + k); el.textContent = STR[k];
  });
  // design-box placement that mirrors for right-to-left
  document.querySelectorAll('.in [data-x]').forEach(function (el) {
    var x = +el.getAttribute('data-x'); el.style.left = (RTL ? 1000 - x : x) + 'px'; el.style.top = el.getAttribute('data-y') + 'px';
  });
  if (RTL) ['#xl', '#pf', '#pb', '#px', '#tl', '#prop', '#border'].forEach(function (s) { var g = document.querySelector(s); g.setAttribute('transform', 'translate(1000 0) scale(-1 1)'); });
  var show = function (s, on) { var e = typeof s === 'string' ? document.querySelector(s) : s; e.style.display = on ? '' : 'none'; };

  // scenes
  var T = { s1: 0, s2: c('p0') - 0.05, s3: c('who') - 0.1, map: c('map') - 0.1, s4: c('route') - 0.1, s5: c('find') - 0.1, s6: c('qual') - 0.1, s7: c('bob') - 0.1,
            s8: c('bld') - 0.1, s9: c('buy') - 0.1, s10: c('br') - 0.1, s11: c('pay') - 0.1, s12: c('cta') - 0.1, s13: c('url') - 0.15 };
  Kit.scene('#s1', 0, T.s2).scene('#s2', T.s2, T.s3).scene('#s3', T.s3, T.map).scene('#s4', T.s4, T.s5).scene('#s5', T.s5, T.s6).scene('#s6', T.s6, T.s7)
     .scene('#s7', T.s7, T.s8).scene('#s8', T.s8, T.s9).scene('#s9', T.s9, T.s10).scene('#s10', T.s10, T.s11).scene('#s11', T.s11, T.s12)
     .scene('#s12', T.s12, T.s13).scene('#s13', T.s13, D);
  Kit.scene('#tangle', 0, c('one') + 0.9).scene('#maplayer', T.map, T.s4).scene('#mtext', T.map, T.s4).scene('#reach', T.map, T.s4).scene('#rail', T.s5, T.s10);
  Kit.add('#tangle', 'opacity', [[0, 0.28], [T.s2, 0.28], [T.s2 + 0.4, 1, 'out'], [T.s3 - 0.2, 1], [T.s3, 0, 'in']]);

  // S1 hook: motion from frame 1
  Kit.slam('#h1', 0.0, { from: 1.15 }).slam('#h2', c('h2'), { from: 1.15 }).slam('#h3', c('h3'), { from: 1.15 });
  Kit.add('#prop', 'opacity', [[0, 0], [T.s2, 0, 'hold'], [T.s2 + 0.3, 1, 'out']]);
  // S2: the five strangers name themselves, the lines tangle across the border
  Kit.each(function (t) { var el = document.getElementById('cap2'); var s = [STR.h1, STR.h2, STR.h3].join(V ? '\n' : ' '); if (el.textContent !== s) el.textContent = s; });
  Kit.pop('#cap2', T.s2, { dy: 10 });
  ['agent', 'lawyer', 'dev', 'builder', 'money'].forEach(function (k, i) {
    Kit.add('#tn' + (i + 1) + ' .l', 'opacity', [[0, 0], [c(k), 0, 'hold'], [c(k) + 0.15, 1, 'out']]);
    Kit.add('#tn' + (i + 1) + ' .l', 'scale', [[c(k), 0.8], [c(k) + 0.25, 1, 'outBack']]);
  });
  for (var i = 1; i <= 8; i++) Kit.add('#t' + i, 'trim', [[c('p0') + 0.3 + i * 0.6, 0], [c('p0') + 1.2 + i * 0.6, 1, 'out']]);
  Kit.each(function (t) { var m = document.getElementById('tn5'); m.style.opacity = (t > c('money') && t < T.s3) ? (0.65 + 0.35 * Math.abs(Math.sin(t * 9))) : ''; });

  // S3 who: the mark, then the world from New Zealand
  Kit.add('#mark', 'scale', [[T.s3, 0.6], [T.s3 + 0.45, 1, 'outBack']]).fade('#mark', T.s3, T.s3 + 0.2);
  Kit.add('#word', 'clipX', [[T.s3 + 0.25, 0], [T.s3 + 0.8, 1, 'out']]);
  Kit.pop('#whocap', c('who') + 0.6, { dy: 18 });
  var MW = V ? { w: 1600, lon: 95, lat: 4 } : { w: 2300, lon: 70, lat: 12 };
  var M = BQ.map(document.getElementById('maplayer'), MW);
  var DEST = ['es', 'it', 'ch', 'lb', 'ae', 'us', 'jp', 'sg', 'za', 'br'];
  var BELOW = { it: 1, ae: 1, sg: 1 };
  var nz = M.pin('nz', 'pin-nz', true, true); nz.querySelector('.pl').textContent = STR.c_nz;
  Kit.add(nz, 'scale', [[c('nz'), 0], [c('nz') + 0.35, 1, 'outBack']]);
  DEST.forEach(function (k, i) {
    var t0 = c('n90') - 0.4 + i * 0.09;   // all routes land well before the route scene
    var a = M.arc('nz', k, 'arc-' + k, 0.3);
    Kit.add(a, 'trim', [[t0, 0], [t0 + 0.75, 1, 'out']]);
    var p = M.pin(k, 'pin-' + k, false, BELOW[k]);
    p.querySelector('.pl').textContent = STR['c_' + k];
    var xy = M.xy(BQ.PLACES[k][0], BQ.PLACES[k][1]);
    var safe = V ? (xy[0] > 150 && xy[0] < 930) : (xy[0] > 180 && xy[0] < 1740 && xy[1] > 80);
    if (!safe || (V && (k === 'uk' || k === 'ch'))) p.querySelector('.pl').style.display = 'none';
    if (!V && (k === 'uk' || k === 'za' || k === 'br')) p.querySelector('.pl').style.display = 'none';
    Kit.add(p, 'scale', [[t0 + 0.65, 0], [t0 + 0.95, 1, 'outBack']]);
  });
  // hide any country label that would sit under the headline panel or on another label (works for every language)
  (function () {
    var grow = function (r, m) { return { l: r.left - m, r: r.right + m, t: r.top - m, b: r.bottom + m }; };
    var hit = function (a, b) { return a.l < b.r && b.l < a.r && a.t < b.b && b.t < a.b; };
    var kept = [grow(document.getElementById('mtext').getBoundingClientRect(), 14), grow(document.querySelector('#pin-nz .pl').getBoundingClientRect(), 8)];
    DEST.forEach(function (k) {
      var pl = document.querySelector('#pin-' + k + ' .pl');
      if (!pl || pl.style.display === 'none') return;
      var r = grow(pl.getBoundingClientRect(), 8);
      if (kept.some(function (q) { return hit(r, q); })) pl.style.display = 'none'; else kept.push(r);
    });
  })();
  Kit.fade('#maplayer', T.map, T.map + 0.6);
  Kit.pop('#m1', c('map'), { dy: 14 }).pop('#m2', c('nz'), { dy: 14 }).slam('#m3', c('n90'), { from: 1.12 });
  Kit.fade('#reach', T.map + 0.3, T.map + 0.8);

  // S4 the route, and who Baqshi brings in
  Kit.pop('#cap4', T.s4 + 0.05, { dy: 12 });
  Kit.pop('#you4', T.s4 + 0.1, { dy: 0 }).add('#bar4', 'scaleX', [[T.s4 + 0.2, 0], [T.s4 + 1.1, 1, 'out']]).pop('#bq4', T.s4 + 0.6, { dy: 12 }).pop('#prop4', T.s4 + 1.0, { dy: 0 });
  document.querySelectorAll('#pil .chip').forEach(function (e, i) { Kit.pop(e, c('route') + 0.9 + i * 0.18, { dy: 10 }); });
  Kit.pop('#n1', c('law'), { dy: -14 }).pop('#n2', c('red'), { dy: -14 }).pop('#n3', c('gov'), { dy: -14 });

  // rail: where we are on the route
  Kit.pop('#rail', T.s5, { dy: -8 });
  Kit.each(function (t) {
    var cur = t < T.s6 ? 1 : t < T.s7 ? 2 : t < T.s8 ? 0 : t < T.s9 ? 4 : 3;
    for (var i = 1; i <= 4; i++) { var e = document.getElementById('rp' + i); e.classList.toggle('on', i === cur || (cur === 0 && (i === 3 || i === 4))); }
  });

  // S5 find
  Kit.pop('#ti1', T.s5 + 0.1, { dy: 20 }).pop('#ti2', T.s5 + 0.25, { dy: 20 }).pop('#ti3', T.s5 + 0.4, { dy: 20 });
  Kit.pop('#fb1', c('brief'), { dy: 12 }).pop('#fb2', c('budget'), { dy: 12 });
  Kit.add('#tk2', 'scale', [[c('budget') + 0.2, 0], [c('budget') + 0.5, 1, 'outBack']]);
  Kit.add('#ti1', 'opacity', [[c('budget') + 0.2, 1], [c('budget') + 0.5, 0.35]]).add('#ti3', 'opacity', [[c('budget') + 0.2, 1], [c('budget') + 0.5, 0.35]]);
  Kit.add('#ti2', 'scale', [[c('budget') + 0.2, 1], [c('budget') + 0.5, 1.08, 'outBack']]);

  // S6 qualify: the route plan, in writing
  Kit.pop('#qpanel', T.s6 + 0.05, { dy: 20 });
  ['q1', 'q2', 'q3', 'q4'].forEach(function (k) {
    Kit.each(function (t) { document.getElementById(k).classList.toggle('on', t >= c(k) + 0.5); });
  });
  Kit.slam('#stamp', c('writ') + 0.1, { from: 1.4, dur: 0.16 });

  // S7 buy or build: illustrative bars, no figures
  Kit.slam('#bob', c('bob'), { from: 1.12 });
  Kit.add('#sg1', 'scaleX', [[c('weigh'), 0], [c('weigh') + 0.8, 1, 'out']]);
  Kit.add('#sg2', 'scaleX', [[c('weigh') + 0.4, 0], [c('weigh') + 1.0, 1, 'out']]).add('#sg3', 'scaleX', [[c('weigh') + 0.9, 0], [c('weigh') + 1.5, 1, 'out']]);
  Kit.fade('#worth', c('weigh') + 1.4, c('weigh') + 1.8);
  Kit.pop('#brk', c('margin') + 0.3, { dy: 0 }).add('#brk', 'scale', [[c('margin') + 0.3, 1.15], [c('margin') + 0.6, 1, 'out']]);

  // S8 build: priced line by line, released straight to whoever did the work
  var CAP8 = [[T.s8, ''], [c('lines'), STR.lines_cap], [c('rel'), STR.rel_cap]];
  Kit.each(function (t) { var s = ''; CAP8.forEach(function (q) { if (t >= q[0]) s = q[1]; }); var el = document.getElementById('cap8'); if (el.textContent !== s) el.textContent = s; });
  Kit.add('#cap8', 'opacity', [[c('lines') - 0.001, 1], [c('lines'), 0.2, 'hold'], [c('lines') + 0.2, 1, 'out'], [c('rel') - 0.001, 1], [c('rel'), 0.2, 'hold'], [c('rel') + 0.2, 1, 'out']]);
  Kit.pop('#s8 .soq', T.s8 + 0.05, { dy: 20 });
  [1, 2, 3, 4].forEach(function (i) {
    Kit.pop('#b' + i + ' .ln', c('lines') + (i - 1) * 0.3, { dy: 8 });
    var t0 = c('rel') + 0.15 + (i - 1) * 0.5;
    var pk = document.querySelector('#b' + i + ' .pk'), fl = document.querySelector('#b' + i + ' .flow');
    Kit.add(pk, 'opacity', [[0, 0], [t0, 0, 'hold'], [t0 + 0.05, 1], [t0 + 0.55, 1], [t0 + 0.7, 0]]);
    Kit.each(function (t) { var w = fl.clientWidth; var p = Math.max(0, Math.min(1, (t - t0) / 0.6)); p = 1 - Math.pow(1 - p, 2); pk.style.transform = 'translateX(' + (SG * p * w) + 'px)'; });
    var to = document.querySelector('#b' + i + ' .to');
    Kit.each(function (t) { to.classList.toggle('on', t >= t0 + 0.6); });
  });
  Kit.fade('#rec', c('qsme') + 0.4, c('qsme') + 0.8);

  // S9 buy: funds and title in, out together
  var XS = [[T.s9, ''], [c('both'), STR.both], [c('np'), STR.np], [c('ns'), STR.ns]];
  Kit.each(function (t) { var s = ''; XS.forEach(function (q) { if (t >= q[0]) s = q[1]; }); var el = document.getElementById('xc'); if (el.textContent !== s) el.textContent = s; });
  [c('both'), c('np'), c('ns')].forEach(function (t0) { Kit.add('#xc', 'scale', [[t0, 0.9], [t0 + 0.2, 1, 'outBack']]); });
  Kit.pop('#xbox', T.s9 + 0.05, { dy: 16 });
  Kit.add('#ring', 'scale', [[c('esc'), 1], [c('esc') + 0.2, 1.08, 'out'], [c('esc') + 0.5, 1, 'out']]);
  Kit.pop('#ringl', c('esc') + 0.1, { dy: 8 });
  Kit.add('#tf', 'x', [[c('funds'), 0], [c('funds') + 0.7, SG * 190, 'inOut'], [c('out'), SG * 190], [c('out') + 0.9, SG * 420, 'inOut']]);
  Kit.add('#tt', 'x', [[c('title'), 0], [c('title') + 0.7, -SG * 190, 'inOut'], [c('out'), -SG * 190], [c('out') + 0.9, -SG * 420, 'inOut']]);
  Kit.add('#tf', 'y', [[c('funds') + 0.7, 0], [c('funds') + 0.9, -26, 'out'], [c('out'), -26], [c('out') + 0.9, 0, 'inOut']]);
  Kit.add('#tt', 'y', [[c('title') + 0.7, 0], [c('title') + 0.9, 26, 'out'], [c('out'), 26], [c('out') + 0.9, 0, 'inOut']]);
  Kit.add('#ring', 'borderColor', [[c('out'), '#4fb8ff'], [c('out') + 0.3, '#a98bff', 'out'], [c('out') + 1.2, '#4fb8ff', 'inOut']]);
  var STEPS = [c('buy') + 0.3, c('funds') + 0.4, c('title') + 0.6, c('esc') + 0.9, c('out') + 0.6, c('both') + 0.8];
  STEPS.forEach(function (t0, i) { Kit.each(function (t) { document.getElementById('st' + (i + 1)).classList.toggle('on', t >= t0); }); });

  // S10 the money: held in escrow, two exits only
  Kit.slam('#devc', c('br') + 0.1, { from: 1.1 }).slam('#brname', c('brn'), { from: 1.12 }).pop('#brdesc', c('brn') + 0.6, { dy: 10 });
  Kit.scene('#hbox', c('hp') - 0.1, c('agr') - 0.1);   // the diagram stays while build / purchase land under it
  Kit.each(function (t) { show('#brhead', t < c('hp') - 0.1); });
  Kit.pop('#hmid', c('hp'), { dy: 12 });
  Kit.add('#px', 'trim', [[c('hp') + 0.6, 0], [c('hp') + 1.3, 1, 'out']]).add('#px', 'opacity', [[c('fwd') - 0.2, 1], [c('fwd'), 0.25]]);
  Kit.slam('#nope', c('hp') + 1.3, { from: 1.5 });
  Kit.add('#pf', 'trim', [[c('fwd'), 0], [c('fwd') + 0.4, 1, 'out']]);
  Kit.add('#pb', 'trim', [[c('back'), 0], [c('back') + 0.4, 1, 'out']]);
  Kit.pop('#hf', c('fwd'), { dy: 0 }).pop('#hb', c('back'), { dy: 0 });
  Kit.each(function (t) { document.getElementById('hf').classList.toggle('lit', t >= c('fwd') + 0.3); document.getElementById('hb').classList.toggle('lit', t >= c('back') + 0.3); });
  Kit.scene('#statrow', c('stat') - 0.1, T.s11).scene('#agrrow', c('agr') - 0.1, T.s11).scene('#agrcap', c('agr') - 0.1, T.s11);
  Kit.pop('#sb1', c('stat'), { dy: 14 }).pop('#sb2', c('stat2'), { dy: 14 }).pop('#agrrow', c('agr'), { dy: 14 }).pop('#agrcap', c('agr') + 0.3, { dy: 8 });

  // S11 payoff: the five strangers collapse into one route
  Kit.add('#tangle', 'opacity', [[T.s11, 0], [T.s11 + 0.3, 1, 'out'], [c('one') + 0.3, 1], [c('one') + 0.9, 0, 'in']]);
  [[170, 120], [820, 110], [860, 430], [210, 460], [500, 290]].forEach(function (p, i) {
    var dx = (RTL ? (1000 - p[0]) : p[0]); dx = 500 - dx;
    Kit.add('#tn' + (i + 1), 'x', [[c('one'), 0], [c('one') + 0.7, dx, 'in']]).add('#tn' + (i + 1), 'y', [[c('one'), 0], [c('one') + 0.7, 300 - p[1], 'in']]);
  });
  Kit.add('#tl', 'opacity', [[c('one'), 1], [c('one') + 0.4, 0]]);
  Kit.scene('#cap11', c('one') - 0.05, T.s12).scene('#r11', c('one') + 0.5, T.s12);
  Kit.slam('#cap11', c('one'), { from: 1.1 });
  Kit.add('#bar11', 'scaleX', [[c('one') + 0.5, 0], [c('one') + 1.3, 1, 'out']]);
  document.querySelectorAll('#pil11 .chip').forEach(function (e, i) { Kit.pop(e, c('one') + 1.2 + i * 0.15, { dy: 10 }); });

  // S12 tell us your route, S13 end card
  Kit.pop('#fd1', c('cta'), { dy: 14 }).pop('#ar12', c('own') - 0.2, { dy: 0 }).pop('#fd2', c('own'), { dy: 14 });
  Kit.add('#lock2', 'scale', [[T.s13, 0.9], [T.s13 + 0.5, 1, 'outBack']]).fade('#lock2', T.s13, T.s13 + 0.25);
  Kit.pop('#tagl', T.s13 + 0.35, { dy: 12 }).pop('#btn', c('url') + 0.3, { dy: 12 }).pop('#reply', c('url') + 0.9, { dy: 8 });

  Kit.ready({ duration: D });
</script>
</body>
</html>

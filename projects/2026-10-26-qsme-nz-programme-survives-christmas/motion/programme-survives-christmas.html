<script>
(function () {
  'use strict';
  var S = Sched, G = S.G, d = S.day, R = document.getElementById('root'), H = '';
  function add(h) { H += h; }
  var caps = [];
  function cap(t0, t1, html) { caps.push([t0, t1, html]); }

  /* ================= clock =================
     cold 0–12.4 · title 12.4–15.6 · 01 same job 15.6–31.0 · 02 shut the site 31.0–52.8 (celebration 44.6, b-roll 49.4)
     03 public holidays 52.8–70.4 · 04 asked, not told 70.4–84.8 · 05 what drives the finish 84.8–102.6 · 06 print it 102.6–113.0 · end 113.0–120.4 */
  var TT = 12.4, C1 = 15.6, C2 = 31.0, CEL = 44.6, BR = 49.4, C3 = 52.8, OCT = 56.8, ANN = 65.8, C4 = 70.4, Q4 = C4 + 1.0, C5 = 84.8, KB2 = 97.0, C6 = 102.6, TE = 113.0, D = 120.4;

  /* ---------------- COLD OPEN: the keenest worker on the job ---------------- */
  var sg = Story.sheetGeo();
  var c25 = sg.cell(3, d(2026, 12, 25)), cLab = sg.cell(1, 'E'), cBox = sg.cell(3, d(2026, 12, 28)), cNY = sg.cell(4, d(2027, 1, 1)), cHO = sg.cell(12, d(2027, 1, 15));
  add('<div id="cold" class="full"><div id="scam" class="scam">' + Story.sheet('sh') + '</div><div id="coldTop"></div><div id="coldBot"></div>' +

      '<div id="h2" class="hl" style="top:150px;font-size:124px;color:#3DC023">Your spreadsheet.</div></div>');

  /* ---------------- TITLE over the townhouses at lock-up (brand b-roll) ---------------- */
  add('<div id="title" class="full"><div id="tcam" class="lcam"><img id="timg" class="f" alt=""></div><div class="shade" style="background:rgba(2,6,23,.62)"></div>' +
      '<div id="t1" class="t1">How a programme<br>survives Christmas</div><div id="t2" class="t2">Same job. Now in QSME.</div>' +
      '<div id="t3" class="t3">A QSME walkthrough · illustrative screens · demo data</div><div class="lbl ill">Illustrative b-roll</div></div>');

  /* ---------------- the app window ---------------- */
  var GD = { x0: d(2026, 12, 14), days: 63, dayW: 19.6, rowH: 48, nameW: 330, headH: 52, rows: ['gib', 'p1', 'kit', 'tile', 'land', 'p2', 'plb', 'ele', 'floor', 'insp', 'hand'], head: 'week', title: 'Task' };

  var OX = 17, OY = 147;   // gantt origin inside the window
  // the empty project (names and bars) is covered until the template is put on
  var extraD = '<div id="adwipe" class="abs" style="left:' + OX + 'px;top:' + (OY + GD.headH) + 'px;width:' + (GD.nameW + GD.days * GD.dayW) + 'px;height:' + (GD.rows.length * GD.rowH) + 'px;background:#fff;z-index:8"></div>' +
    Story.templates('adT', { x: 420, y: 80 }) + Story.daysOff('adD', { x: 420, y: 90, noHol: true }) + Story.daysOff('adA', { x: 420, y: 26, own: true, noHol: true }) +
    Story.viewMenu('adV', { x: 936, y: 66 }) + Story.exportMenu('adE', { x: 998, y: 66 });
  var extraO = Story.taskCard('aoC', { x: 1090, y: 196 });
  add('<div id="win" class="win" data-qa-ignore><div id="wcam" class="wcam">' +
      '<div id="appD" class="abs" style="left:0;top:0">' + Story.app('ad', { w: 1600, h: 750, gantt: GD, gx: 16, gy: 146, fin: 'Wed 20 Jan 2027', extra: extraD }) + '</div>' +

      // editor callouts (window coords)
      '<div id="coH4" class="callout amb" style="left:540px;top:588px">4 public holidays</div>' +
      '<div id="coR" class="callout" style="left:540px;top:638px">The rest: ordinary working days</div>' +
      '<div id="coL" class="callout amb" style="left:700px;top:512px">Labour Day · today</div>' +
      '<div id="coA" class="callout" style="left:1310px;top:240px">Not built in: added by hand</div>' +
      '</div></div>');

  /* live public pages (Knowledge Hub), real captures */
  var mk1 = Story.uline('kbu1', 918, 384, 204, '#E0302A', 5) + Story.uline('kbu2', 452, 410, 396, '#E0302A', 5);
  var mk2 = Story.uline('kbu3', 492, 440, 460, '#A855F7', 5) + Story.uline('kbu4', 938, 504, 160, '#A855F7', 6);
  add(Story.live('lv1', { x: 160, y: 118, w: 1600, h: 750, url: 'qsme.co.nz/knowledge-hub/schedule', marks: mk1 }));
  add(Story.live('lv2', { x: 160, y: 118, w: 1600, h: 750, url: 'qsme.co.nz/knowledge-hub/schedule-colours', marks: mk2 }));

  /* celebration (no green confetti: it would match the subline) */
  var conf = '', seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  var CC = ['#F59E0B', '#A855F7', '#0EA5E9', '#F8FAFC', '#E0302A'];
  for (var i = 0; i < 46; i++) conf += '<div id="cf' + i + '" class="conf" style="left:' + Math.round(960 + (rnd() - 0.5) * 120) + 'px;top:' + Math.round(560 + (rnd() - 0.5) * 60) + 'px;background:' + CC[i % CC.length] + '"></div>';
  add('<div id="cel" class="full"><div class="veil"></div><div id="confw">' + conf + '</div><div id="k1" class="k1">Congratulations.</div><div id="k2" class="k2">Your finish date just got later.</div>' +
      '<div id="k3" class="card2"><i>FINISHES</i><s>Wed 20 Jan 2027</s><b>Wed 3 Feb 2027</b></div></div>');

  /* b-roll cutaway: fit-out (painting); label in the usual top-right slot, clear of the caption */
  add('<div id="br" class="full"><div id="brcam" class="lcam"><img id="brimg" class="f" alt=""></div><div class="shade"></div><div class="lbl ill">Illustrative b-roll</div></div>');

  add('<div id="pdfv" class="abs" data-qa-ignore style="z-index:30;left:96px;top:112px;width:1728px;height:914px;overflow:hidden"><div id="pcam" class="abs" style="left:302px;top:8px;width:1123px;height:794px;transform-origin:561px 397px">' +

  /* end card */
  add('<div id="end" class="full"><div id="ecam" class="lcam"><img id="eimg" class="f" alt=""></div><div class="ov"></div>' +
      '<div id="elogo" class="logo"><img src="qsme-logo.svg" alt="QSME" style="position:absolute;left:-35px;top:0;width:300px"></div>' +
      '<div id="e1" class="e1">A finish date you can still<br>say out loud in <span class="a">January.</span></div>' +
      '<div id="ebtn" class="btnx">Sign up at qsme.co.nz</div><div id="efn" class="fn">Illustrative screens · demo data · illustrative b-roll</div></div>');

  /* HUD */
  var CHN = ['The same job', 'Shut the site', 'Public holidays', 'Asked, not told', 'What drives the finish', 'Print it'];
  CHN.forEach(function (s, i) { add('<div id="chap' + i + '" class="chap"><b>0' + (i + 1) + '</b>' + s + '</div>'); });
  add('<div id="lbI" class="lbl ill">Illustrative screen · demo data</div>');
  add('<div id="lbL" class="lbl live"><i></i>Live page · qsme.co.nz Knowledge Hub</div>');
  add('<div id="lbS0" class="lbl drm" style="top:auto;bottom:66px">Generic spreadsheet · demo data</div>');
  add('<div id="lbS" class="lbl drm">Generic spreadsheet · demo data</div>');
  add('<div id="tg1" class="ftag l">Nothing moves until you press the button.</div>');
  add('<div id="tg2" class="ftag l pu">Purple — This task drives the finish date.</div>');
  add('<div id="tg3" class="ftag r">A few days later: all four confirmed (demo)</div>');

  /* ---------------- captions (target ≤ ~2.6 words/s with the sound off) ---------------- */
  cap(4.0, 6.9, 'Worked Labour Day. Worked Boxing Day. Worked New Year\'s.');
  cap(7.1, 9.1, 'Didn\'t even go to the bach.');
  cap(9.3, 12.2, 'Handover 15 Jan. She\'ll be right.');
  cap(C1 + 0.4, C1 + 4.2, 'QSME shuts the site 23 Dec – 11 Jan by default.');
  cap(C1 + 4.4, C1 + 6.8, 'Switch it off, like the spreadsheet.');
  cap(C1 + 7.0, C1 + 9.8, 'Same job, from the Townhouses programme.');
  cap(C1 + 10.4, C1 + 12.6, 'Public holidays: built in.');
  cap(C1 + 12.9, C1 + 15.2, 'Finishes Wed 20 Jan. Mid-January. Lovely.');
  cap(C2 + 0.4, C2 + 2.9, 'Switch it back on.');
  cap(C2 + 3.8, C2 + 6.2, 'Only 4 are public holidays.');
  cap(C2 + 6.4, C2 + 9.6, 'Your spreadsheet called the rest working days.');
  cap(C2 + 10.2, C2 + 13.4, 'Move them off. There\'s your real finish.');

  cap(BR + 0.2, BR + 3.3, 'Nobody\'s painting on Christmas Day. Now the programme knows.');

  cap(OCT + 0.2, OCT + 4.6, 'Drop a job on Labour Day and it lands on the Tuesday.');

  cap(C4 + 0.2, C4 + 5.6, 'Anyone booked on QSME is asked. Nothing changes for them till they say yes.');
  cap(Q4 + 5.3, Q4 + 9.2, 'On QSME and by email.');
  cap(Q4 + 9.5, Q4 + 13.2, 'One yes, and that bar turns blue.');
  cap(C5 + 0.3, C5 + 4.0, 'Tick ‘What drives the finish date’: the <span class="p">purple</span> chain.');
  cap(C5 + 4.3, C5 + 7.6, 'Slide a grey job: the finish doesn\'t budge.');
  cap(C5 + 7.9, C5 + 11.4, 'Slip a <span class="p">purple</span> one a day: the finish moves a day.');

  cap(C6 + 2.9, C6 + 6.0, '<span class="p">Purple</span> rings on paper too.');

  caps.forEach(function (c, i) { add('<div id="cap' + i + '" class="caption box"><span>' + c[2] + '</span></div>'); });
  R.innerHTML = H;

  /* ======================= TIMELINE ======================= */
  Kit.scene('#cold', 0, TT).scene('#title', TT, C1).scene('#cel', CEL, BR).scene('#br', BR, C3).scene('#lv1', C3, OCT).scene('#lv2', KB2, C6);
  Kit.scene('#ph', Q4 + 4.9, Q4 + 9.7).scene('#pdfv', C6 + 2.5, TE).scene('#end', TE, D + 1);

  Kit.add('#appD', 'opacity', [[0, 1], [OCT, 0, 'hold'], [ANN, 1, 'hold']]);

  /* ---------- cold open ---------- */
  var scam = '#scam';
  Kit.add(scam, 'var:--cs', [[0, 1.38], [3.1, 1.43, 'linear'], [3.9, 0.84, 'swipe'], [8.9, 0.87, 'linear'], [9.6, 0.98, 'swipe'], [12.4, 1.0, 'linear']]);

<!-- QSME NZ · "The January lie" · 9:16 cut of "How a programme survives Christmas" (beats 1–3) for Reels / TikTok.
     2026-10-06 AUDIO-FIRST REMAKE (owner standard from the N01 pilot: continuous speech, a spoken hook, no silence over 1 s,
     ONE unbroken Cam S eleven_v3 take, picture follows audio). The take is the clock: outputs/vo-take-cam-v3-9x16/take.mp3,
     38.40 s (2026-10-10 take, CTA "dot koh dot en zed"), laid at 0.0 -> this page runs 39.90 s (take + 1.5 s tail). The page is still AUTHORED on the 33 s timeline below
     and re-timed by W(): a piecewise-linear map from authoring time to take time through ANCHORS, each pinned to the start of
     the word it belongs to (vo-words-9x16.js = outputs/vo-take-cam-v3-9x16/words.json). Captions are phrases lifted from the
     narration, placed in take time. Design unchanged. The silent 33 s v1 is outputs/archive/january-lie-9x16-v1.mp4.
     Original notes:
     Same builders as the 16:9 master (sched.js / story.js / psc.css). Generic spreadsheet (no brand UI) → illustrative QSME
     schedule (verbatim wording, demo data, labelled) → the finish moves out → end card.
     The schedule is a portrait crop (21 Dec – 7 Feb, 7 rows) built small and scaled up 1.4x so the UI reads on a phone;
     the Christmas shutdown is ON by default in QSME, so the cut says "we switched it off", then switches it back on.
     All text inside 65,300,1015,1250; captions kept within x 65–940 (clear of the TikTok / Reels right-rail buttons).
     Owner CTA rule 2026-10-03: no "free"; CTA = Sign up at qsme.co.nz. -->

<script>
(function () {
  'use strict';
  var S = Sched, G = S.G, d = S.day, R = document.getElementById('root'), H = '';

  var caps = [];
  /* authoring clock (unchanged): hook 0–3.3 · sheet 3.3–10.3 · QSME 10.3–25.1 (Days off 15.0, back on 16.0, band 17.0, rings 18.5, notice 19.8, move 22.4) · celebration 25.1–29.2 · end 29.2–33.0 */

  /* ================= authoring time -> take time (the take is the clock) =================
     [authoring t, take t]: take t = the start of the word named on the right (vo-words-9x16.js, index:word). Between anchors
     the design plays as authored, stretched or squeezed. Every Kit call below goes through W(); Kit.each hooks get authoring
     time back (Winv), so G.run / Story.textAt / Story.cursor keep their authored keys. Captions are placed in take time. */
  var VO = window.VO_WORDS, ws = function (i) { return VO[i][1]; }, we = function (i) { return VO[i][2]; };
  var TAKE = we(VO.length - 1), OUT_D = Math.round((TAKE + 1.5) * 100) / 100;   // 38.40 + 1.5 = 39.90
  var ANCHORS = [
    [0, 0],                      // 0 "Only one on your job working Christmas Day?" (hook on from frame 0)

    [EX - 0.2, we(9) - 0.1],     // hook fades as "spreadsheet." ends

    [8.2, we(22) - 0.5],         // camera settled on the holidays

    [WH, ws(29) - 0.4],          // whip starts as "right." ends

    [ON + 0.4, ws(46) + 0.13],   // toggle settled on "on."
    [CL, we(46) + 0.04],         // dialog closes, shut band draws, as "on." ends

    [CEL + 1.0, ws(75) - 0.08],  // 75 the struck-through card on "got"
    [CEL + 1.3, ws(75) + 0.27],  // confetti

    [TE, we(82) + 0.19],         // end card
    [TE + 0.5, ws(83) + 0.02],   // 83 "A finish date you can still say out loud in January."
    [TE + 1.1, ws(94) - 0.02],   // 94 button pops on "Sign up"
    [TE + 2.4, ws(99) - 0.1],    // button pulse on "Mee dot koh dot en zed"
    [TE + 2.9, ws(101) + 0.04],
    [D, OUT_D]                   // take 38.40 + 1.5 s tail
  ];
  for (var ai = 1; ai < ANCHORS.length; ai++) if (!(ANCHORS[ai][0] > ANCHORS[ai - 1][0] && ANCHORS[ai][1] > ANCHORS[ai - 1][1])) throw new Error('ANCHORS not increasing at ' + ai + ': ' + ANCHORS[ai - 1] + ' -> ' + ANCHORS[ai]);
  function W(t) {
    var n = ANCHORS.length; if (t <= ANCHORS[0][0]) return ANCHORS[0][1] + (t - ANCHORS[0][0]);
    for (var i = 1; i < n; i++) { var a = ANCHORS[i - 1], b = ANCHORS[i]; if (t <= b[0]) return a[1] + (b[1] - a[1]) * (t - a[0]) / (b[0] - a[0]); }
    return ANCHORS[n - 1][1] + (t - ANCHORS[n - 1][0]);
  }
  function Winv(o) {
    var n = ANCHORS.length; if (o <= ANCHORS[0][1]) return ANCHORS[0][0] + (o - ANCHORS[0][1]);
    for (var i = 1; i < n; i++) { var a = ANCHORS[i - 1], b = ANCHORS[i]; if (o <= b[1]) return a[0] + (b[0] - a[0]) * (o - a[1]) / (b[1] - a[1]); }
    return ANCHORS[n - 1][0] + (o - ANCHORS[n - 1][1]);
  }
  var _add = Kit.add, _scene = Kit.scene, _type = Kit.type, _clip = Kit.clip, _count = Kit.count, _each = Kit.each;
  Kit.add = function (target, prop, keys) { return _add.call(Kit, target, prop, keys.map(function (k) { var c = k.slice(); c[0] = W(k[0]); return c; })); };
  Kit.scene = function (target, t0, t1) { return _scene.call(Kit, target, W(t0), W(t1)); };
  Kit.type = function (target, t0, t1) { return _type.call(Kit, target, W(t0), W(t1)); };
  Kit.clip = function (target, o) { var c = {}; for (var k in o) c[k] = o[k]; c.t0 = W(o.t0); if (o.t1 != null) c.t1 = W(o.t1); return _clip.call(Kit, target, c); };
  Kit.count = function (target, keys, fmt) { return _count.call(Kit, target, keys.map(function (k) { var c = k.slice(); c[0] = W(k[0]); return c; }), fmt); };

  var GP = { x0: d(2026, 12, 21), days: 49, dayW: 9.4, rowH: 56, nameW: 200, headH: 44, rows: ['p1', 'kit', 'tile', 'land', 'p2', 'plb', 'hand'], head: 'week', title: 'Task', fs: 1.0, lab: 'short' };

  /* labels (the spreadsheet is labelled from frame 0: under the hook panel, then the usual top slot) */
  add('<div id="lbS0" class="lbl drm" style="right:65px;top:1062px">Generic spreadsheet · demo data</div>');

  add('<div id="lbE" class="lbl ill" style="right:65px;top:304px;font-size:20px">Illustrative screens · demo data · b-roll</div>');

  /* captions: short phrases lifted from the narration, placed on the words (take time); bottom edge of the box at 1244; x 65–940 */
  function capW(i0, i1, html, tmax) { caps.push([ws(i0) - 0.05, we(i1) + 0.6, html, tmax]); }
  capW(10, 16, 'Worked Labour Day. Boxing Day. New Year\'s.');
  capW(17, 22, 'Didn\'t even go to the bach.');
  capW(23, 28, 'Handover the fifteenth. She\'ll be right.', W(AP) - 0.05);
  capW(29, 34, 'Same job in QSME.');
  capW(35, 42, 'Shutdown\'s on by default; we switched it off.');
  capW(43, 46, 'Switch it back on.');
  capW(47, 54, 'Only four of those days are public holidays.');
  capW(55, 61, 'Your spreadsheet called the rest working days.');

  capW(79, 82, 'It was always February.', W(TE) - 0.05);
  caps.forEach(function (c, i) { var nx = caps[i + 1]; if (nx) c[1] = Math.min(c[1], nx[0] - 0.08); if (c[3] != null) c[1] = Math.min(c[1], c[3]); });

  var ann = document.getElementById('shann');
  ann.id = 'shpann';
  ann.innerHTML =

  [['rLab', 'tLab', EX + 0.65], ['rBox', 'tBox', EX + 1.35], ['rNY', 'tNY', EX + 2.05], ['rHO', 'tHO', 8.95, 9.5]].forEach(function (a) {

  Kit.add('#apw', 'x', [[WH, 1100], [AP, 0, 'swipe']]);

  /* ---------- QSME portrait chart (S0 → S1 only: no Anniversary day off in this cut) ---------- */
  var BK = { kit: 'S0', tile: 'S0', plb: 'S0' }, WT = { kit: 'waiting', tile: 'waiting', plb: 'waiting' }, RA = { kit: 'amber', tile: 'amber', plb: 'amber' };
  var HL = {}; S.onShut(S.P.S0).forEach(function (t) { HL[t.id] = 'hl'; });
  var ST = { S0: { r: S.P.S0 }, S0h: { r: S.P.S0, deco: { ring: HL } }, S1p: { r: S.P.S1, deco: { ghost: BK, st: WT, ring: RA } } };
  // rings on the jobs sitting on shut days draw at RG ("Your spreadsheet CALLED the rest working days"), after the band is in
  Kit.each(G.run('apg', GP, ST, [[0, 'S0'], [RG, 'S0h', 0.3, 'out'], [MV + 0.1, 'S1p', 0.9, 'swipe']]));
  document.querySelectorAll('#apg .bar .drag').forEach(function (n) { var e = document.createElement('div'); e.className = 'rh'; e.style.cssText = 'position:absolute;inset:-4px;border-radius:9px;border:3px solid #0F172A;opacity:0'; n.appendChild(e); });
  Kit.each(function (t) { var p = t >= RG && t < MV + 0.15 ? Math.min(1, (t - RG) / 0.3) : 0; document.querySelectorAll('#apg .rh').forEach(function (n) { n.style.opacity = HL[n.parentNode.id.replace('apgd_', '')] ? p : 0; }); });
  // the finish date changes once the chart has slid (MV + 1.0), on the word "finish."
  Story.textAt('#apfinD', [[0, 'Wed 20 Jan 2027'], [MV + 1.1, 'Wed 3 Feb 2027']]);
  Kit.add('#apfin', 'scale', [[MV + 1.05, 1], [MV + 1.2, 1.12, 'out'], [MV + 1.5, 1, 'inOut']]);
  Kit.add('#apfin', 'borderColor', [[0, '#E2E8F0'], [MV + 1.0, '#E2E8F0'], [MV + 1.1, '#F59E0B']]);
  Kit.add('#apgshut', 'opacity', [[0, 0], [CL, 0, 'hold'], [CL + 0.4, 1, 'out']]);
  Kit.add('#apgann', 'opacity', [[0, 0]]);   // the Anniversary day off is never added in this cut
  // days off dialog: the shutdown starts switched off (we switched it off), then goes back on
  Kit.add('#apD', 'opacity', [[0, 0], [DO + 0.2, 0, 'hold'], [DO + 0.4, 1, 'out'], [CL, 1], [CL + 0.18, 0, 'in']]).add('#apD', 'scale', [[DO + 0.2, 0.96], [DO + 0.45, 1, 'out']]);
  Kit.add('#apscr', 'opacity', [[0, 0], [DO + 0.2, 0], [DO + 0.4, 1], [CL, 1], [CL + 0.2, 0]]);
  Kit.add('#apDoff', 'opacity', [[0, 1], [ON + 0.05, 1], [ON + 0.25, 0]]).add('#apDon', 'opacity', [[0, 0], [ON + 0.05, 0], [ON + 0.25, 1]]);
  Kit.add('#apDpre', 'opacity', [[0, 0.25], [ON + 0.1, 0.25], [ON + 0.4, 1, 'out']]);
  Kit.add('#apDtg', 'background', [[0, '#CBD5E1'], [ON, '#CBD5E1'], [ON + 0.15, '#16A34A']]).add('#apDtgk', 'x', [[ON, 0], [ON + 0.17, 22, 'out']]);
  Kit.add('#apntc', 'opacity', [[0, 0], [NT, 0, 'hold'], [NT + 0.3, 1, 'out'], [MV + 0.25, 1], [MV + 0.5, 0, 'in']]).add('#apntc', 'y', [[NT, 16], [NT + 0.3, 0, 'out']]);
  Kit.add('#apntcB', 'scale', [[MV - 0.1, 1], [MV, 0.94], [MV + 0.15, 1]]);
  Kit.add('#aptst', 'opacity', [[0, 0]]);
  // cursor (app coords, measured on the 680x530 shell)
  var CUR = { days: [384, 36], tog: [607, 290], mv: [180, 476] };
  Story.cursor('#apcur', [[AP, 420, 300], [DO - 0.3, CUR.days[0], CUR.days[1]], [DO, CUR.days[0], CUR.days[1], 1], [ON - 0.4, CUR.tog[0], CUR.tog[1]], [ON - 0.05, CUR.tog[0], CUR.tog[1], 1], [CL + 0.5, 470, 330], [NT, 470, 330],
    [MV - 0.6, CUR.mv[0], CUR.mv[1]], [MV - 0.1, CUR.mv[0], CUR.mv[1], 1], [MV + 1.2, 470, 300]]);

  /* ---------- celebration ---------- */
  Kit.add('#cel', 'opacity', [[CEL, 0], [CEL + 0.25, 1], [TE - 0.2, 1], [TE, 0]]);
  Kit.slam('#k1', CEL + 0.2, { from: 1.2 }).pop('#k2', CEL + 0.7, { dy: 26 });
  Kit.add('#k3', 'opacity', [[CEL + 1.0, 0], [CEL + 1.1, 1]]).add('#k3', 'scale', [[CEL + 1.0, 0.7], [CEL + 1.3, 1, 'outBack']]);
  seed = 99;
  for (var j = 0; j < 44; j++) {
    var ang = rnd() * Math.PI * 2, sp = 420 + rnd() * 560, vx = Math.cos(ang) * sp * 0.7, vy = Math.sin(ang) * sp - 300, r0 = rnd() * 360, rr = (rnd() - 0.5) * 900, t0 = CEL + 1.1 + rnd() * 0.15;
    var xs = [], ys = [], rs = [];
    for (var s = 0; s <= 10; s++) { var tt = s * 0.3; xs.push([t0 + tt, vx * tt * 0.8, s ? 'linear' : undefined]); ys.push([t0 + tt, vy * tt + 560 * tt * tt * 0.6, s ? 'linear' : undefined]); rs.push([t0 + tt, r0 + rr * tt, s ? 'linear' : undefined]); }
    Kit.add('#cf' + j, 'x', xs).add('#cf' + j, 'y', ys).add('#cf' + j, 'rotate', rs).add('#cf' + j, 'opacity', [[t0 - 0.01, 0], [t0, 1], [t0 + 2.2, 1], [t0 + 2.7, 0]]);
  }

  /* ---------- end card ---------- */
  Kit.clip('#eimg', { dir: 'clips/complete', t0: TE, fps: 30, ext: '.jpg', frames: 192, speed: 0.57, from: 45 });   // 8.6 s of footage for the 8.7 s end card (holds the last frame)
  Kit.add('#ebg', 'scale', [[TE, 1.0], [D, 1.06, 'linear']]);
  Kit.add('#end', 'opacity', [[TE, 0], [TE + 0.3, 1]]);
  Kit.pop('#elogo', TE + 0.25, { dy: 20 }).pop('#e1', TE + 0.5, { dy: 30 }).pop('#ebtn', TE + 1.1, { dy: 24 });
  Kit.add('#ebtn', 'scale', [[TE + 2.4, 1], [TE + 2.6, 1.05, 'out'], [TE + 2.9, 1, 'inOut']]);

  caps.forEach(function (c, i) {   // take time: raw tracks (not through W)
    _add.call(Kit, '#cap' + i, 'opacity', [[c[0], 0], [c[0] + 0.16, 1, 'out'], [c[1] - 0.12, 1], [c[1], 0, 'in']]);
    _add.call(Kit, '#cap' + i, 'y', [[c[0], 18], [c[0] + 0.24, 0, 'out']]);
  });
  Kit.ready({ duration: OUT_D, fonts: ['800 60px Manrope', '400 20px Inter', '500 20px Inter', '600 20px Inter', '700 20px Inter', '800 20px Inter', '400 40px "Permanent Marker"', '500 20px "JetBrains Mono"', '700 20px "JetBrains Mono"'] });
})();

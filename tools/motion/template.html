<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<title>Motion kit template</title>
<!-- Copy this file into projects/<folder>/motion/<name>.html and fix the two relative paths below. -->
<link rel="stylesheet" href="kit.css">
<style>
  #hook { left: 65px; right: 65px; top: 420px; font-size: 104px; }
  #chip { left: 65px; top: 320px; }
  #line { left: 65px; top: 760px; width: 950px; }
  #cap { top: 1080px; }
  #end { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; }
  #logo { width: 520px; }
</style>
</head>
<body class="nz r9x16">
<div id="root">
  <div id="s1" class="fill">
    <div id="chip" class="abs chip">site search · demo</div>
    <div id="hook" class="abs display">One section.<br><span class="accent">What could it be?</span></div>
    <svg id="line" class="abs" height="20" viewBox="0 0 950 20"><path id="stroke" d="M4 12 C 240 2, 620 20, 946 8" fill="none" stroke="#E0302A" stroke-width="8" stroke-linecap="round"/></svg>
    <div id="cap" class="caption box"><span>Type the address. See what fits.</span></div>
  </div>
  <div id="end" class="fill">
    <img id="logo" src="qsme-logo.svg" alt="QSME">
    <div id="cta" class="pill">qsme.co.nz</div>
  </div>
</div>
<script src="kit.js"></script>
<script>
  Kit.scene('#s1', 0, 4.2).scene('#end', 4.2, 6);
  Kit.pop('#chip', 0.1).slam('#hook', 0.35);
  Kit.add('#stroke', 'trim', [[1.0, 0], [1.5, 1, 'out']]);
  Kit.pop('#cap', 1.8).out('#cap', 3.9);
  Kit.add('#s1', 'x', [[3.9, 0], [4.2, -1080, 'swipe']]);
  Kit.fade('#logo', 4.25, 4.6).add('#logo', 'scale', [[4.25, 0.94], [4.7, 1, 'out']]);
  Kit.pop('#cta', 4.7);
  Kit.ready({ duration: 6 });
</script>
</body>
</html>
